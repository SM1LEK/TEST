<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1606.0" viewBox="0 160 1120 1606" role="img">
  <title>GF(256) • байт как многочлен над GF(2)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="1606.0" fill="#1f1e24" y="160.0" />
  <path d="M560 230 L560 300" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 430 L560 520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 655 L560 750" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M 214 120 H 930 L 906 230 H 190 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="311.06" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">a = 83₁₆ = 10000011₂</text>
  <text x="560" y="338.56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: a = 131 = 10000011₂</text>
  <text x="560" y="376.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">a(z) = z⁷ + z + 1</text>
  <rect x="190" y="600.0" width="740" height="260.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="664.22" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">P(z) = z⁸ + z⁴ + z³ + z² + 1 = 11D₁₆</text>
  <text x="560" y="691.72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: P(z) = z⁸ + z⁴ + z³ + z² + 1 = 285</text>
  <text x="560" y="730.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Сложение: XOR</text>
  <text x="560" y="783.68" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Умножение: многочлены modulo P(z)</text>
  <rect x="190" y="1040.0" width="740" height="270.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1109.22" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">80₁₆ × 02₁₆: z⁷ × z = z⁸</text>
  <text x="560" y="1136.72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: 128 × 2: z⁷ × z = z⁸</text>
  <text x="560" y="1175.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">z⁸ ≡ z⁴ + z³ + z² + 1</text>
  <text x="560" y="1216.5800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат: 00011101₂ = 1D₁₆</text>
  <text x="560" y="1244.0800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Результат: 00011101₂ = 29</text>
  <rect x="190" y="1500.0" width="740" height="210.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1578.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Для a ≠ 0: a²⁵⁵ = 1; a⁻¹ = a²⁵⁴</text>
  <text x="560" y="1631.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Деление: a / b = a × b⁻¹, b ≠ 0</text>
</svg>