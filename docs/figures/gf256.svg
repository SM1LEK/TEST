<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="803" viewBox="0 80 1120 803" role="img">
  <title>GF(256) • байт как многочлен над GF(2)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="803.0" fill="#1f1e24" y="80" />
  <path d="M560 230 L560 300" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 430 L560 520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 655 L560 750" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 214 120 H 930 L 906 230 H 190 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="161.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">a = 0x83 = 10000011₂</text>
  <text x="560" y="188.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">a(z) = z⁷ + z + 1</text>
  <rect x="190" y="300" width="740" height="130" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="338.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">P(z) = z⁸ + z⁴ + z³ + z² + 1 = 0x11D</text>
  <text x="560" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Сложение: XOR</text>
  <text x="560" y="391.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Умножение: многочлены modulo P(z)</text>
  <rect x="190" y="520" width="740" height="135" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="560.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">0x80 × 0x02: z⁷ × z = z⁸</text>
  <text x="560" y="587.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">z⁸ ≡ z⁴ + z³ + z² + 1</text>
  <text x="560" y="614.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат: 00011101₂ = 0x1D</text>
  <rect x="190" y="750" width="740" height="105" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="789.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Для a ≠ 0: a²⁵⁵ = 1; a⁻¹ = a²⁵⁴</text>
  <text x="560" y="815.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Деление: a / b = a × b⁻¹, b ≠ 0</text>
</svg>