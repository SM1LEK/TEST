<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1084" viewBox="0 0 1320 1084"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><rect x="30" y="24" width="1260" height="102" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="61.0">Алфавит сортируется по значению байта; D − 1 занимает один байт.</tspan><tspan x="50" y="92.9">D ≤ 32: список D байтов. D &gt; 32: карта ровно 32 байта.</tspan></text><rect x="30" y="150" width="260" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="39" y="177.0">Пример (hex)</tspan></text><rect x="290" y="150" width="150" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="299" y="177.0">D−1 (hex)</tspan></text><rect x="440" y="150" width="370" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="449" y="177.0">Поле алфавита</tspan></text><rect x="810" y="150" width="480" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="819" y="177.0">Частоты</tspan></text><rect x="30" y="232" width="260" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="259.0">A, B, N</tspan></text><rect x="290" y="232" width="150" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="299" y="259.0">02</tspan></text><rect x="440" y="232" width="370" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="449" y="259.0">41 42 4E</tspan></text><rect x="810" y="232" width="480" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="819" y="259.0">Две записаны; третья = 4096 − сумма</tspan></text><rect x="30" y="314" width="260" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="341.0">Байты 00 … 1F</tspan></text><rect x="290" y="314" width="150" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="299" y="341.0">1F</tspan></text><rect x="440" y="314" width="370" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="449" y="341.0">Список: 32 байта</tspan></text><rect x="810" y="314" width="480" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="819" y="341.0">31 значение LEB128</tspan></text><rect x="30" y="396" width="260" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="423.0">Байты 00 … 20</tspan></text><rect x="290" y="396" width="150" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="299" y="423.0">20</tspan></text><rect x="440" y="396" width="370" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="449" y="423.0">FF FF FF FF 01 + 27 нулей</tspan></text><rect x="810" y="396" width="480" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="819" y="423.0">32 значения LEB128</tspan></text><rect x="30" y="478" width="260" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="505.0">Один A</tspan></text><rect x="290" y="478" width="150" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="299" y="505.0">00</tspan></text><rect x="440" y="478" width="370" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="449" y="505.0">41</tspan></text><rect x="810" y="478" width="480" height="82" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="819" y="505.0">Не записаны; f(A) = 4096</tspan></text><rect x="30" y="588" width="1260" height="136" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="625.0">Символ s → индекс карты i = floor(s/8), номер бита k = s mod 8.</tspan><tspan x="50" y="656.9">Пример s = 0x20 = 32: i = 4; k = 0; bitmap[4] содержит 01.</tspan><tspan x="50" y="688.8">Внутри байта младший бит отвечает младшему символу группы.</tspan></text><rect x="30" y="748" width="300" height="58" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="39" y="777.0">Бит k</tspan></text><rect x=