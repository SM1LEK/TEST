<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="737" viewBox="0 0 1200 737" role="img" aria-labelledby="title desc"><title id="title">Модули, структуры и передаваемые данные</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Модули, структуры и передаваемые данные</text><rect x="30" y="94" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">archive::{pack,unpack,paths}</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">EncodingOptions { lz77, rans, protected }; Names { entries, directories }.</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">pack_path/write_name/pack_file → поток записей; process/read_name → Entry и Statistics.</text>
<rect x="30" y="244" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="278" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">block::{writer,reader}</text>
<text x="50" y="315" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">BlockWriter: output, options, buffer, pending, executor. Поля sequence в v3 нет.</text>
<text x="50" y="346" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">StoredBlock: original_size, stored_size, payload, corrected_shards.</text>
<text x="50" y="377" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">DecodedBlock: data, compressed, corrected_shards. BlockReader выдаёт блоки через Read.</text>
<rect x="30" y="425" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="459" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">lz77, rans, ecc</text>
<text x="50" y="496" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Matcher: heads[4096], previous[N], last_byte[256].</text>
<text x="50" y="527" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">rANS: counts[256], frequencies[256], starts[256], таблица symbols[4096].</text>
<text x="50" y="558" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">ecc: один переиспользуемый ReedSolomon(10,2); CRC-таблица + 12 равных фрагментов.</text>
<rect x="30" y="606" width="1140" height="95" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="640" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">parallel::Executor</text>
<text x="50" y="677" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Sequential либо Parallel { threads, pool }. map сохраняет порядок входного Vec.</text></svg>