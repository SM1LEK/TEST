<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1221" viewBox="0 0 1200 1221" role="img" aria-labelledby="title desc"><title id="title">Выбор представления и защита блока</title><desc id="desc">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Выбор представления и защита блока</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вход X; N=|X|</text>
<rect x="240" y="250" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Выполнить включённую комбинацию</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">LZ77 → rANS; получить C, K=|C|</text>
<polygon points="570.0,395 900,453.0 570.0,511 240,453.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="461.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">K &lt; N?</text>
<rect x="240" y="564" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="608.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Y=C, S=K</text>
<rect x="240" y="689" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="733.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Иначе Y=X, S=N</text>
<rect x="240" y="814" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="858.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">B = u16 LE(N−1) | u16 LE(S−1)</text>
<polygon points="265,939 900,939 875,1031 240,1031" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="978.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Без RS: B | Y</text>
<text x="570.0" y="1007.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">С RS: RS(B) | RS(Y)</text>
<rect x="240" y="1084" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1128.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть физический блок</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 511 V 564" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="543" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 900 453.0 H 1033 V 725.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1043" y="441.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 240 600.0 H 156 V 850.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 761 V 814" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 886 V 939" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 1031 V 1084" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>