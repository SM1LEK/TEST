<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1245" viewBox="0 0 1200 1245" role="img" aria-labelledby="title desc"><title id="title">LZ77: декодирование</title><desc id="desc">Недопустимая команда или обрыв поля завершают декодирование ошибкой.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">LZ77: декодирование</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Недопустимая команда или обрыв поля завершают декодирование ошибкой.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало</text>
<polygon points="265,250 900,250 875,322 240,322" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="294.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Прочитать N ≤ 65536; R = пустой буфер</text>
<polygon points="570.0,375 900,433.0 570.0,491 240,433.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="441.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Есть байты команд?</text>
<polygon points="265,544 900,544 875,616 240,616" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="588.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Прочитать l; d при l&gt;0; затем c</text>
<polygon points="570.0,669 900,727.0 570.0,785 240,727.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="720.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">1 ≤ d ≤ min(4096, |R|) при l&gt;0?</text>
<text x="570.0" y="749.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">l+1 ≤ N−|R|?</text>
<rect x="240" y="838" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="877.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">l раз: R.push(R[|R|−d])</text>
<text x="570.0" y="906.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Затем R.push(c)</text>
<rect x="240" y="983" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="1027.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Проверить |R|=N; иначе ошибка</text>
<rect x="240" y="1108" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1152.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть R</text>
<rect x="950" y="692.0" width="220" height="70" rx="30" fill="#1f1e24" stroke="#e99aab" stroke-width="1.4"/>
<text x="1060" y="735.0" font-family="Arial, sans-serif" font-size="22" fill="#e99aab" text-anchor="middle">Ошибка</text>
<path d="M 900 727.0 H 950" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="910" y="715.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 322 V 375" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 491 V 544" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="523" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 616 V 669" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 785 V 838" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="817" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 240 884.0 H 145 V 433.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="133" y="872.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Повтор</text>
<path d="M 900 433.0 H 1066 V 1019.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1076" y="421.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 1055 V 1108" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>