<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1052" viewBox="0 0 1200 1052" role="img" aria-labelledby="title desc"><title id="title">RS: кодирование одного слова</title><desc id="desc">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">RS: кодирование одного слова</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вход: payload, U байт</text>
<rect x="240" y="250" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">q=max(1,ceil((U+4)/10))</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Добавить u32 LE(U); дополнить до 10q нулями</text>
<rect x="240" y="395" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="439.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Разделить на 10 фрагментов D₀…D₉</text>
<rect x="240" y="520" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="559.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Для j=0…q−1 вычислить P₀[j], P₁[j]</text>
<text x="570.0" y="588.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">как две строки G·D в GF(256)</text>
<rect x="240" y="665" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="709.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вычислить CRC32 всех 12 фрагментов</text>
<polygon points="265,790 900,790 875,862 240,862" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="834.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Записать CRC[12] | D₀…D₉ | P₀ | P₁</text>
<rect x="240" y="915" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="959.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Результат: E(U)=48+12q байт</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 467 V 520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 612 V 665" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 737 V 790" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 862 V 915" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>