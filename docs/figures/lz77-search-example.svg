<text x="50" y="336" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Проверка</text>
<text x="50" y="373" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">h(0x61,0x62) = ((0x6261·0x9E3779B1) mod 2³²) &gt;&gt; 20 = 761.</text>
<text x="50" y="404" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Поиск идёт от новых позиций к старым. При равенстве best не заменяется.</text>
<text x="50" y="435" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Код v3 просматривает максимум 512 кандидатов одной цепочки; коллизии проверяются по байтам.</text>
<text x="50" y="466" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Полный поток: 09 00 61 00 62 00 58 02 03 59 02 03 5A. Размер 13 байт вместо 9.</text></svg>