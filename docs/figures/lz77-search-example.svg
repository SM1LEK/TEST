xt><rect x="30" y="1282.0" width="1260" height="272.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="1343.9">c = X[03₁₆ + 02₁₆] = 59₁₆; тройка: 02 03 59</tspan><tspan x="50" y="1371.4" font-size="20.0" fill="#bbb6c3">₁₀: c = X[3 + 2] = 89; тройка: 2 3 89</tspan><tspan x="50" y="1407.7">p′ = 03₁₆ + 02₁₆ + 01₁₆ = 06₁₆</tspan><tspan x="50" y="1435.2" font-size="20.0" fill="#bbb6c3">₁₀: p′ = 3 + 2 + 1 = 6</tspan><tspan x="50" y="1471.5">Добавить пройденные позиции 03₁₆, 04₁₆, 05₁₆ в таблицу поиска</tspan><tspan x="50" y="1499.0" font-size="20.0" fill="#bbb6c3">₁₀: Добавить пройденные позиции 3, 4, 5 в таблицу поиска</tspan></text><rect x="30" y="1602.0" width="1260" height="340.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="1663.9">p = 06₁₆; limit = 02₁₆; ближайший кандидат p − d = 03₁₆</tspan><tspan x="50" y="1691.4" font-size="20.0" fill="#bbb6c3">₁₀: p = 6; limit = 2; ближайший кандидат p − d = 3</tspan><tspan x="50" y="1727.7">61₁₆ = 61₁₆; 62₁₆ = 62₁₆ ⇒ l = limit = 02₁₆, поиск завершён</tspan><tspan x="50" y="1755.2" font-size="20.0" fill="#bbb6c3">₁₀: 97 = 97; 98 = 98 ⇒ l = limit = 2, поиск завершён</tspan><tspan x="50" y="1791.5">Кандидат 00₁₆ тоже дал бы l = 02₁₆, но расстояние 06₁₆ больше</tspan><tspan x="50" y="1819.0" font-size="20.0" fill="#bbb6c3">₁₀: Кандидат 0 тоже дал бы l = 2, но расстояние 6 больше</tspan><tspan x="50" y="1855.3000000000002">c = X[08₁₆] = 5A₁₆; тройка: 02 03 5A; p′ = 09₁₆</tspan><tspan x="50" y="1882.8000000000002" font-size="20.0" fill="#bbb6c3">₁₀: c = X[8] = 90; тройка: 2 3 90; p′ = 9</tspan></text><rect x="30" y="1990.0" width="1260" height="272.0" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="2064.0">N | литерал a | литерал b | литерал X | ссылка ab + Y | ссылка ab + Z</tspan><tspan x="50" y="2115.7000000000003">09 | 00 61 | 00 62 | 00 58 | 02 03 59 | 02 03 5A</tspan><tspan x="50" y="2143.2000000000003" font-size="20.0" fill="#bbb6c3">₁₀: 9 | 0 97 | 0 98 | 0 88 | 2 3 89 | 2 3 90</tspan><tspan x="50" y="2179.5">Размер: 0D₁₆ &gt; 09₁₆; итоговый блочный выбор может сохранить X</tspan><tspan x="50" y="2207.0" font-size="20.0" fill="#bbb6c3">₁₀: Размер: 13 &gt; 9; итоговый блочный выбор может сохранить X</tspan></text></svg>