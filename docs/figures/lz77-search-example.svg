ke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="549" y="552.0">X[04] = 62</tspan></text><rect x="920" y="525" width="370" height="44" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="929" y="552.0">=</tspan></text><rect x="30" y="569" width="130" height="44" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="596.0">02</tspan></text><rect x="160" y="569" width="380" height="44" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="169" y="596.0">X[02] = 58</tspan></text><rect x="540" y="569" width="380" height="44" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="549" y="596.0">X[05] = 59</tspan></text><rect x="920" y="569" width="370" height="44" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="929" y="596.0">≠ → l = 0x02</tspan></text><rect x="30" y="641" width="1260" height="136" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="678.0">c = X[0x03 + 0x02] = 0x59; тройка: 02 03 59</tspan><tspan x="50" y="709.9">p′ = 0x03 + 0x02 + 0x01 = 0x06</tspan><tspan x="50" y="741.8">Добавить пройденные позиции 0x03, 0x04, 0x05 в таблицу поиска</tspan></text><rect x="30" y="801" width="1260" height="170" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="838.0">p = 0x06; limit = 0x02; ближайший кандидат p − d = 0x03</tspan><tspan x="50" y="869.9">61 = 61;