font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="552.75" y="99.6">Данные: 223 байта</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1062.75" y="85.9">32 байта</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1062.75" y="111.9">RS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="616.75" y="200.3">Полное кодовое слово: 255 байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="616.75" y="228.9">До 16 неизвестных замен на слово</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="130.75" y="338.9">12</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="218.75" y="325.3">32 байта</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="218.75" y="353.9">RS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="731.75" y="339.6">Заголовок: 12 + 32 = 44 байта</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="616.75" y="438.1">Укороченное слово: k + 32 байта; без заполнения</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="616.75" y="465.4">E(S) = S + 32 × ceil(S / 223)</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="271.75" y="565.9">Данные: k байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="271.75" y="591.9">1 ≤ k ≤ 223; без выравнивания</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="626.75" y="566.5">Проверка: 32 байта</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="626.75" y="589.9">r(x) = m(x) * x^ 32 mod g(x)</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="981.75" y="565.9">Физический размер</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="981.75" y="591.9">k + 32 байта</text></g></svg>