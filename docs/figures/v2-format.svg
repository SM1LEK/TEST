<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1064" viewBox="0 0 1120 1064" role="img"><title>CLARSv02 • полный пример: файл a с байтом A</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 245 L560 330" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 450 L560 545" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 675 L560 775" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">CLARSv02 • полный пример: файл a с байтом A</text>
<path d="M 134 110 H 1010 L 986 245 H 110 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="150.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Запись: 01 | 01 | 61 | 01 | 41 | 00</text>
<text x="560" y="177.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Файл | длина имени | a | размер | A | конец</text>
<text x="560" y="204.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N = S = 6; сжатие не применяется</text>
<rect x="110" y="330" width="900" height="120" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="363.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Без RS; флаги 00</text>
<text x="560" y="390" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">43 4C 41 52 53 76 30 32 | 00</text>
<text x="560" y="416.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">CLARSv02 | флаги</text>
<rect x="110" y="545" width="900" height="130" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="583.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Заголовок блока: 05 00 | 05 00</text>
<text x="560" y="610" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N − 1 = 5 | S − 1 = 5</text>
<text x="560" y="636.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Затем: 01 01 61 01 41 00</text>
<path d="M 134 775 H 1010 L 986 900 H 110 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="810.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Полный архив — 19 байт</text>
<text x="560" y="837.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">43 4C 41 52 53 76 30 32 00</text>
<text x="560" y="864.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">05 00 05 00 01 01 61 01 41 00</text>
<text x="560" y="992" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">При --protect: флаги 04, три копии заголовка, RS payload 60 байт; всего 81 байт.</text>
</svg>