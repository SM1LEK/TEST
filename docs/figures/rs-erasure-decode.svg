<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1261" viewBox="0 0 1200 1261" role="img" aria-labelledby="title desc"><title id="title">RS: декодирование одного слова</title><desc id="desc">e&gt;2, обрыв и недопустимые размеры → ошибка. CRC-таблица не входит в RS.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">RS: декодирование одного слова</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">e&gt;2, обрыв и недопустимые размеры → ошибка. CRC-таблица не входит в RS.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало</text>
<rect x="240" y="250" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Проверить длину: 48+12q, q≥1</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Разделить CRC-таблицу и фрагменты</text>
<rect x="240" y="395" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="434.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Сравнить CRC всех 12 фрагментов</text>
<text x="570.0" y="463.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Несовпавшие → None; их число e</text>
<polygon points="570.0,540 900,598.0 570.0,656 240,598.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="606.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">e ≤ 2?</text>
<rect x="240" y="709" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="748.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Если e&gt;0: reconstruct</text>
<text x="570.0" y="777.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Если e=0: реконструкция не вызывается</text>
<rect x="240" y="854" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="893.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Соединить D₀…D₉; прочитать U</text>
<text x="570.0" y="922.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Проверить U ≤ 10q−4</text>
<polygon points="265,999 900,999 875,1071 240,1071" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="1043.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть ровно U байт и число e</text>
<rect x="240" y="1124" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1168.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Конец</text>
<rect x="950" y="563.0" width="220" height="70" rx="30" fill="#1f1e24" stroke="#e99aab" stroke-width="1.4"/>
<text x="1060" y="606.0" font-family="Arial, sans-serif" font-size="22" fill="#e99aab" text-anchor="middle">Ошибка</text>
<path d="M 900 598.0 H 950" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="910" y="586.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 487 V 540" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 656 V 709" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="688" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 801 V 854" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 946 V 999" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 1071 V 1124" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>