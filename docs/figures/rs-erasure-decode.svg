<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1142" viewBox="0 0 1120 1142" role="img"><title>RS(12,10) • декодирование по обнаруженным стираниям</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 195 L560 243" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 368 L560 416" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 516 L560 564" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 664 L560 712" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 842 L560 890" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M860 466 L900 466" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">RS(12,10) • декодирование по обнаруженным стираниям</text>
<path d="M 284 110 H 860 L 836 195 H 260 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="152.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход: таблица CRC32 и 12 фрагментов</text>
<rect x="260" y="243" width="600" height="125" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="278.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Сравнить CRC каждого фрагмента</text>
<text x="560" y="305.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Несовпавший отметить как отсутствующий</text>
<text x="560" y="332.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">e = число таких фрагментов</text>
<path d="M 560.0 416 L 860 466.0 L 560.0 516 L 260 466.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="466" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">e ≤ 2?</text>
<rect x="260" y="564" width="600" height="100" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="600.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">При e &gt; 0 восстановить</text>
<text x="560" y="627.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">по любым 10 исправным строкам G</text>
<rect x="260" y="712" width="600" height="130" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="750.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Собрать D₀ … D₉</text>
<text x="560" y="777" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать S из первых 4 байтов</text>
<text x="560" y="803.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Проверить S ≤ 10q − 4; удалить заполнение</text>
<path d="M 284 890 H 860 L 836 990 H 260 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="926.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выход: Y и число e</text>
<text x="560" y="953.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Далее rANS и LZ77 только при S &lt; N</text>
<rect x="900" y="436.0" width="175" height="60" rx="30.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="987.5" y="466" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Ошибка</text>
<text x="880" y="448" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<text x="600" y="536" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="560" y="1070" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Исправляются до 2 обнаруженных фрагментов, не «16 неизвестных байтовых ошибок».</text>
</svg>