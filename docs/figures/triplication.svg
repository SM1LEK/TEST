<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-labelledby="title desc"><title id="title">Два независимых способа защиты заголовков</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Два независимых способа защиты заголовков</text><rect x="30" y="94" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Общий заголовок, всегда</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">H содержит сигнатуру и флаги, 9 байт. Запись H|H|H = 27 байт.</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Побайтовое большинство; действует и без --protect.</text>
<rect x="30" y="244" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="278" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">Заголовок блока, только с --protect</text>
<text x="50" y="315" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">B содержит N−1 и S−1, 4 байта. Запись RS(B)=60 байт.</text>
<text x="50" y="346" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Внутри: 12 CRC32 (48 байт) + 12 фрагментов по 1 байту.</text>
<rect x="30" y="394" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="428" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Почему сначала B</text>
<text x="50" y="465" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Длина RS(B) фиксирована. Восстановив B, читатель узнаёт S и длину RS(Y).</text>
<text x="50" y="496" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Заголовок блока v3 не троируется. Общий заголовок не входит в RS.</text></svg>