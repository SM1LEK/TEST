<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="924" viewBox="0 0 1120 924" role="img"><title>LZ77 • окно поиска и тройка (l, d, c)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M114 224 L114 260 L558 260 L558 224" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">LZ77 • окно поиска и тройка (l, d, c)</text>
<rect x="40" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="114" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p − d</text>
<rect x="188" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="262" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">…</text>
<rect x="336" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="410" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p − 1</text>
<rect x="484" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="558" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p</text>
<rect x="632" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="706" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">…</text>
<rect x="780" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="854" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p + l − 1</text>
<rect x="928" y="150" width="148" height="74" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1002" y="187" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p + l</text>
<path d="M 64 310 H 484 L 460 404 H 40 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="262" y="343.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Уже обработанные позиции</text>
<text x="262" y="370.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">max(0, p − 4096) … p − 1</text>
<path d="M 508 310 H 928 L 904 404 H 484 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="706" y="343.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Совпадение длины l</text>
<text x="706" y="370.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">X[p − d + j] = X[p + j]</text>
<path d="M 952 310 H 1076 L 1052 404 H 928 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1002" y="343.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Явный</text>
<text x="1002" y="370.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">байт c</text>
<text x="334" y="238" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">d</text>
<rect x="170" y="480" width="780" height="132" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="519.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">0 ≤ l ≤ min(255, N − p − 1)</text>
<text x="560" y="546" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">При l &gt; 0: 1 ≤ d ≤ min(4096, p)</text>
<text x="560" y="572.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">c = X[p + l]; следующая позиция p′ = p + l + 1</text>
<path d="M 94 680 H 1050 L 1026 758 H 70 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="719" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Запись: l : u8 | d : varint только при l &gt; 0 | c : u8</text>
<text x="560" y="852" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Словарь новый для каждого блока. Совпадение может перекрывать текущую позицию.</text>
</svg>