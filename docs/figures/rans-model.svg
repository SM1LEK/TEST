<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img" aria-labelledby="title desc"><title id="title">rANS: частоты и выбор символа</title><desc id="desc">BANAN; A:1638, B:820, N:1638. Полуинтервалы относятся к q=x mod 4096.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">rANS: частоты и выбор символа</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">BANAN; A:1638, B:820, N:1638. Полуинтервалы относятся к q=x mod 4096.</text><rect x="30" y="125" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="159" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Нормализация</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Базовые частоты (1638,819,1638) дают 4095. Наибольший остаток у B: +1.</text>
<text x="50" y="227" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Итог: f(A)=1638, f(B)=820, f(N)=1638; начала c=(0,1638,2458).</text>
<rect x="50.0" y="275" width="439.892578125" height="95" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="269.9462890625" y="318" font-family="Arial, sans-serif" font-size="25" fill="#8bd6b0" text-anchor="middle">A</text>
<text x="269.9462890625" y="351" font-family="Arial, sans-serif" font-size="20" fill="#ececef" text-anchor="middle">[0, 1638)</text>
<rect x="489.892578125" y="275" width="220.21484375" height="95" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="600.0" y="318" font-family="Arial, sans-serif" font-size="25" fill="#f1c779" text-anchor="middle">B</text>
<text x="600.0" y="351" font-family="Arial, sans-serif" font-size="20" fill="#ececef" text-anchor="middle">[1638, 2458)</text>
<rect x="710.107421875" y="275" width="439.892578125" height="95" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="930.0537109375" y="318" font-family="Arial, sans-serif" font-size="25" fill="#84baff" text-anchor="middle">N</text>
<text x="930.0537109375" y="351" font-family="Arial, sans-serif" font-size="20" fill="#ececef" text-anchor="middle">[2458, 4096)</text>
<rect x="30" y="410" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="444" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Обратный переход</text>
<text x="50" y="481" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Для x=1638521112: q=x mod 4096=2328; 1638 ≤ q &lt; 2458 → B.</text>
<text x="50" y="512" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">D_B(x)=820·400029+2328−1638=328024470.</text></svg>