<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img">
  <title>Защищенный архив CLARSv03</title>
  <rect width="1000" height="720" fill="#1f1e24"/>
  <text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="24" fill="#ececef">Защищенный архив CLARSv03</text>

  <rect x="100" y="80" width="800" height="70" fill="#1f1e24" stroke="#8bd6b0" stroke-width="2"/>
  <text x="500" y="123" text-anchor="middle" font-family="Arial" font-size="20" fill="#ececef">Копия 1 общего заголовка: CLARSv03 | флаги, 9 байт</text>
  <rect x="100" y="150" width="800" height="70" fill="#1f1e24" stroke="#8bd6b0" stroke-width="2"/>
  <text x="500" y="193" text-anchor="middle" font-family="Arial" font-size="20" fill="#ececef">Копия 2 общего заголовка: CLARSv03 | флаги, 9 байт</text>
  <rect x="100" y="220" width="800" height="70" fill="#1f1e24" stroke="#8bd6b0" stroke-width="2"/>
  <text x="500" y="263" text-anchor="middle" font-family="Arial" font-size="20" fill="#ececef">Копия 3 общего заголовка: CLARSv03 | флаги, 9 байт</text>

  <rect x="100" y="330" width="800" height="100" fill="#1f1e24" stroke="#f1c779" stroke-width="2"/>
  <text x="500" y="370" text-anchor="middle" font-family="Arial" font-size="20" fill="#ececef">RS-слово заголовка блока, 60 байт</text>
  <text x="500" y="402" text-anchor="middle" font-family="Arial" font-size="18" fill="#bbb6c3">12 CRC32 | 10 фрагментов данных | 2 проверочных фрагмента</text>

  <rect x="100" y="470" width="800" height="100" fill="#1f1e24" stroke="#f1c779" stroke-width="2"/>
  <text x="500" y="510" text-anchor="middle" font-family="Arial" font-size="20" fill="#ececef">Отдельное RS-слово сохраненных данных блока</text>
  <text x="500" y="542" text-anchor="middle" font-family="Arial" font-size="18" fill="#bbb6c3">Размер вычисляется после восстановления заголовка блока</text>

  <rect x="100" y="610" width="800" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="2"/>
  <text x="500" y="652" text-anchor="middle" font-family="Arial" font-size="19" fill="#ececef">Следующие блоки имеют такое же строение</text>
</svg>
