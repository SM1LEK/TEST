<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img"><title>CLARSLIB • модель данных и этапы кодирования</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 190 L560 238" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 318 L560 366" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 456 L560 504" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 584 L560 632" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 712 L560 760" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 850 L560 898" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">CLARSLIB • модель данных и этапы кодирования</text>
<path d="M 364 110 H 780 L 756 190 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="136.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Файлы и папки</text>
<text x="560" y="163.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Имена UTF-8, содержимое байтами</text>
<rect x="340" y="238" width="440" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="264.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Сериализация записей</text>
<text x="560" y="291.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Тип → имя → размер → содержимое</text>
<path d="M 364 366 H 780 L 756 456 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="384.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Блоки X₀, X₁, …</text>
<text x="560" y="411" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">1 ≤ N ≤ 65536</text>
<text x="560" y="437.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Границы записей независимы</text>
<rect x="340" y="504" width="440" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="530.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">LZ77 → rANS</text>
<text x="560" y="557.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Только включённые этапы</text>
<rect x="340" y="632" width="440" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="658.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выбор представления</text>
<text x="560" y="685.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Сжатое, только если S &lt; N</text>
<rect x="340" y="760" width="440" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="791.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Заголовок блока</text>
<text x="560" y="818.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">При защите: три копии + RS(12,10)</text>
<path d="M 364 898 H 780 L 756 978 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="924.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Архив</text>
<text x="560" y="951.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">CLARSv02 | флаги | блоки</text>
<text x="560" y="1058" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Обратный путь: RS → rANS → LZ77 → поток записей → файлы и папки.</text>
</svg>