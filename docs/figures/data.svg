<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="835" viewBox="0 0 1320 835"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><rect x="30" y="24" width="1260" height="102" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="61.0">Файлы и папки → записи → блок X, N ≤ 65 536 байт</tspan><tspan x="50" y="92.9">Общий заголовок: CLARSv03 + флаги; 9 байт × 3 = 27 байт</tspan></text><text font-family="Arial" font-size="24" fill="#84baff" text-anchor="start"><tspan x="40" y="174.0">СОЗДАНИЕ</tspan></text><rect x="40" y="206" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="247.775">LZ77, если включён → поток троек</tspan></text><path d="M320,278 L320,311" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="311" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="352.775">rANS, если включён → кандидат C</tspan></text><path d="M320,383 L320,416" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="416" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="457.775">|C| &lt; N: Y = C; иначе Y = X</tspan></text><path d="M320,488 L320,521" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="521" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="562.775">B = u16 LE(N−1) | u16 LE(S−1)</tspan></text><path d="M320,593 L320,626" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="626" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="667.775">Выбрать одну форму физической записи:</tspan></text><path d="M320,698 L320,731" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="731" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="320.0" y="757.55">Без RS: B | Y</tspan><tspan x="320.0" y="788.0">С RS: RS(B) | RS(Y)</tspan></text><text font-family="Arial" font-size="24" fill="#84baff" text-anchor="start"><tspan x="700" y="174.0">ЧТЕНИЕ</tspan></text><rect x="700" y="206" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="247.775">Восстановить общий заголовок</tspan></text><path d="M980,278 L980,311" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="311" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="352.775">RS: отдельно снять RS(B), затем RS(Y)</tspan></text><path d="M980,383 L980,416" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="416" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="457.775">S = N: результат Y; кодеки не вызывать</tspan></text><path d="M980,488 L980,521" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="521" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="547.55">S &lt; N: снять включённые этапы</tspan><tspan x="980.0" y="578.0">rANS⁻¹ → LZ77⁻¹</tspan></text><path d="M980,593 L980,626" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="626" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="667.775">Проверить длину результата = N</tspan></text><path d="M980,698 L980,731" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="700" y="731" width="560" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="21" fill="#b3afb9" text-anchor="middle"><tspan x="980.0" y="772.775">Собрать записи; проверить конец 00</tspan></text></svg>