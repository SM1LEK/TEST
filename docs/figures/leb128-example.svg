<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1134.0" viewBox="0 0 1320 1134"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9" /></marker></defs><rect width="100%" height="100%" fill="#1f1e24" /><rect x="30" y="50.0" width="1260" height="204.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="111.9">v = 12C₁₆ = 0000010 0101100₂</tspan><tspan x="50" y="139.4" font-size="20.0" fill="#bbb6c3">₁₀: v = 300 = 0000010 0101100₂</tspan><tspan x="50" y="175.70000000000002">Группы по 07₁₆ бит: старшая 02₁₆ | младшая 2C₁₆</tspan><tspan x="50" y="203.20000000000002" font-size="20.0" fill="#bbb6c3">₁₀: Группы по 7 бит: старшая 2 | младшая 44</tspan></text><rect x="30" y="302.0" width="220" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="39" y="356.0">Группа</tspan></text><rect x="250" y="302.0" width="500" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="259" y="356.0">Семь информационных бит</tspan></text><rect x="750" y="302.0" width="190" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="759" y="356.0">Продолжение</tspan></text><rect x="940" y="302.0" width="350" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="949" y="356.0">Байт</tspan></text><rect x="30" y="426.0" width="220" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="480.0">Младшая</tspan></text><rect x="250" y="426.0" width="500" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="259" y="469.0">0101100₂ = 2C₁₆</tspan><tspan x="259" y="494.0" font-size="18.0" fill="#bbb6c3">₁₀: 0101100₂ = 44</tspan></text><rect x="750" y="426.0" width="190" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="759" y="480.0">1</tspan></text><rect x="940" y="426.0" width="350" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="949" y="469.0">10101100₂ = AC₁₆</tspan><tspan x="949" y="494.0" font-size="18.0" fill="#bbb6c3">₁₀: 10101100₂ = 172</tspan></text><rect x="30" y="550.0" width="220" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="604.0">Старшая</tspan></text><rect x="250" y="550.0" width="500" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="259" y="593.0">0000010₂ = 02₁₆</tspan><tspan x="259" y="618.0" font-size="18.0" fill="#bbb6c3">₁₀: 0000010₂ = 2</tspan></text><rect x="750" y="550.0" width="190" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="759" y="604.0">0</tspan></text><rect x="940" y="550.0" width="350" height="124.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="949" y="593.0">00000010₂ = 02₁₆</tspan><tspan x="949" y="618.0" font-size="18.0" fill="#bbb6c3">₁₀: 00000010₂ = 2</tspan></text><rect x="30" y="730.0" width="1260" height="340.0" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="791.9">Кодирование: 2C₁₆ OR 80₁₆ = AC₁₆; затем 02₁₆</tspan><tspan x="50" y="819.4" font-size="20.0" fill="#bbb6c3">₁₀: Кодирование: 44 OR 128 = 172; затем 2</tspan><tspan x="50" y="855.6999999999999">Порядок в потоке: AC 02</tspan><tspan x="50" y="883.1999999999999" font-size="20.0" fill="#bbb6c3">₁₀: Порядок в потоке: 172 2</tspan><tspan x="50" y="919.5">Декодирование: (AC₁₆ &amp; 7F₁₆) + ((02₁₆ &amp; 7F₁₆) &lt;&lt; 7)</tspan><tspan x="50" y="947.0" font-size="20.0" fill="#bbb6c3">₁₀: Декодирование: (172 &amp; 127) + ((2 &amp; 127) &lt;&lt; 7)</tspan><tspan x="50" y="983.3">                  = 2C₁₆ + 100₁₆ = 12C₁₆</tspan><tspan x="50" y="1010.8" font-size="20.0" fill="#bbb6c3">₁₀:                   = 44 + 256 = 300</tspan></text></svg>