<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="567" viewBox="0 0 1320 567"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><rect x="30" y="25" width="1260" height="102" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="62.0">v = 0x12C = 0000010 0101100₂</tspan><tspan x="50" y="93.9">Группы по 0x07 бит: старшая 0x02 | младшая 0x2C</tspan></text><rect x="30" y="151" width="220" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="39" y="178.0">Группа</tspan></text><rect x="250" y="151" width="500" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="259" y="178.0">Семь информационных бит</tspan></text><rect x="750" y="151" width="190" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="759" y="178.0">Продолжение</tspan></text><rect x="940" y="151" width="350" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="949" y="178.0">Байт</tspan></text><rect x="30" y="213" width="220" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="240.0">Младшая</tspan></text><rect x="250" y="213" width="500" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="259" y="240.0">0101100 = 0x2C</tspan></text><rect x="750" y="213" width="190" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="759" y="240.0">1</tspan></text><rect x="940" y="213" width="350" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="949" y="240.0">10101100 = AC</tspan></text><rect x="30" y="275" width="220" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="302.0">Старшая</tspan></text><rect x="250" y="275" width="500" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="259" y="302.0">0000010 = 0x02</tspan></text><rect x="750" y="275" width="190" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="759" y="302.0">0</tspan></text><rect x="940" y="275" width="350" height="62" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="949" y="302.0">00000010 = 02</tspan></text><rect x="30" y="365" width="1260" height="170" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="402.0">Кодирование: 0x2C OR 0x80 = 0xAC; затем 0x02</tspan><tspan x="50" y="433.9">Порядок в потоке: AC 02</tspan><tspan x="50" y="465.8">Декодирование: (0xAC &amp; 0x7F) + ((0x02 &amp; 0x7F) &lt;&lt; 0x07)</tspan><tspan x="50" y="497.7">                  = 0x2C + 0x100 = 0x12C</tspan></text></svg>