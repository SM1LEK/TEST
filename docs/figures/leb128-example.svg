<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img" aria-labelledby="title desc"><title id="title">LEB128: кодирование числа 300</title><desc id="desc">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">LEB128: кодирование числа 300</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</text><rect x="30" y="125" width="220" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="42" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Шаг</text>
<rect x="250" y="125" width="440" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="262" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Расчёт</text>
<rect x="690" y="125" width="480" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="702" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Результат</text>
<rect x="30" y="176" width="220" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Разделить на</text>
<text x="42" y="236" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">7-битовые группы</text>
<rect x="250" y="176" width="440" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">300 = 2·128 + 44</text>
<rect x="690" y="176" width="480" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Старшая: 0000010; младшая: 0101100</text>
<rect x="30" y="256" width="220" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Первый байт</text>
<rect x="250" y="256" width="440" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">44 | 128 = 172</text>
<rect x="690" y="256" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">10101100₂ = AC hex</text>
<rect x="30" y="307" width="220" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="338" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Второй байт</text>
<rect x="250" y="307" width="440" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="338" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2; продолжения нет</text>
<rect x="690" y="307" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="338" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">00000010₂ = 02 hex</text>
<rect x="30" y="358" width="220" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="389" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Порядок записи</text>
<rect x="250" y="358" width="440" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="389" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Младшая группа первой</text>
<rect x="690" y="358" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="389" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">AC 02</text>
<rect x="30" y="409" width="220" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Декодирование</text>
<rect x="250" y="409" width="440" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">(172 &amp; 127) + ((2 &amp; 127) &lt;&lt; 7)</text>
<rect x="690" y="409" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">44 + 256 = 300</text>
<rect x="30" y="460" width="220" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Неканонический</text>
<text x="42" y="520" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">поток</text>
<rect x="250" y="460" width="440" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="262" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">AC 82 00</text>
<rect x="690" y="460" width="480" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Ошибка: лишняя нулевая группа</text></svg>