<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="1000" viewBox="0 0 1164 1000"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><rect x="48.75" y="40.75" width="1040" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="48.75" y="120.75" width="640" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="688.75" y="120.75" width="80" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="768.75" y="120.75" width="320" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="48.75" y="235.75" width="1040" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="48.75" y="345.75" width="174" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="222.75" y="345.75" width="174" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="396.75" y="345.75" width="346" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="742.75" y="345.75" width="346" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="50.61" y="458.75" width="1040" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="50.61" y="558.75" width="1040" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="50.61" y="633.75" width="200" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="260.61" y="633.75" width="200" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="470.61" y="633.75" width="200" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="680.61" y="633.75" width="200" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="890.61" y="633.75" width="200" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="50.61" y="778.75" width="1040" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="50.61" y="853.75" width="330" height="105" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="405.61" y="853.75" width="330" height="105" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="760.61" y="853.75" width="330" height="105" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><path d="M 250.61 688.75 L 249.43 688.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 258.93 688.75 L 249.43 693.5 L 249.43 684 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 460.61 688.75 L 459.43 688.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 468.93 688.75 L 459.43 693.5 L 459.43 684 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 670.61 688.75 L 669.43 688.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 678.93 688.75 L 669.43 693.5 L 669.43 684 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 880.61 688.75 L 879.43 688.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 888.93 688.75 L 879.43 693.5 L 879.43 684 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 380.61 905.75 L 394.43 905.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 403.93 905.75 L 394.43 910.5 L 394.43 901 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 735.61 905.75 L 749.43 905.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 758.93 905.75 L 749.43 910.5 L 749.43 901 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="568.75" y="82.1">Заголовок архива: 13 байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="368.75" y="174.6">0..=7: CLARSLIB</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="728.75" y="160.9">8:</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="728.75" y="186.9">Ф</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="928.75" y="174.6">9..=12: CRC32</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="568.75" y="275.3">Заголовок блока: 12 байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="568.75" y="303.9">N исходный размер; S сохранённый размер</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="135.75" y="385.3">0..=1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="135.75" y="413.9">N − 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="309.75" y="385.3">2..=3</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="309.75" y="413.9">S − 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="569.75" y="385.3">4..=7</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="569.75" y="413.9">CRC32 данных</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="915.75" y="385.3">8..=11</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="915.75" y="413.9">CRC32 заголовка</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="493.3">Без RS: 12 + S байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="521.9">С RS: 44 + S + 32 * ceil(S / 223) байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="600.1">Поток записей файла внутри payload</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="150.61" y="679.7">type 1 байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="150.61" y="700.5">00 конец</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="150.61" y="721.3">01 файл; 02 папка</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="360.61" y="679.7">P varint</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="360.61" y="700.5">длина имени</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="360.61" y="721.3">P байт UTF8</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="679.7">F varint</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="700.5">размер файла</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="721.3">только для файла</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.61" y="679.7">F байт</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.61" y="700.5">содержимое</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.61" y="721.3">может перейти в блок</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="990.61" y="679.7">00</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="990.61" y="700.5">конец архива</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="990.61" y="721.3">после него блоков нет</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="820.1">Reed–Solomon RS(255,223): заголовок и payload защищаются отдельно</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="215.61" y="905.8">Заголовок блока</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="215.61" y="934.4">12 байт + 32 parity</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="895.3">Payload до RS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="918.7">слова по k байт + 32 parity</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="570.61" y="942.1">k = min(223, remaining)</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="925.61" y="895.3">Размер после RS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="925.61" y="918.7">E(S) = S + 32 * ceil(S / 223)</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="925.61" y="942.1">B_RS = 44 + E(S)</text></g></svg>