<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" role="img"><title>CLARSv02 • физическая раскладка архива</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<text x="620" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">CLARSv02 • физическая раскладка архива</text>
<text x="620" y="136" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Заголовок архива: 9 байт</text>
<rect x="40" y="180" width="920" height="75" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="500" y="217.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">0…7: CLARSv02</text>
<rect x="960" y="180" width="240" height="75" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1080" y="217.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">8: флаги</text>
<text x="620" y="351" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Блок без RS: 4 + S байт</text>
<rect x="40" y="400" width="220" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="150" y="431.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N − 1</text>
<text x="150" y="458.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">u16 LE</text>
<rect x="260" y="400" width="220" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="370" y="431.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">S − 1</text>
<text x="370" y="458.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">u16 LE</text>
<rect x="480" y="400" width="720" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="840" y="445" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Y: S байт</text>
<text x="620" y="591" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Блок с RS: 12 + 48 + 12q байт; q = ceil((S + 4) / 10)</text>
<rect x="40" y="650" width="180" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="130" y="684.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">H₀</text>
<text x="130" y="710.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">4 байта</text>
<rect x="220" y="650" width="180" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="310" y="684.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">H₁</text>
<text x="310" y="710.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">4 байта</text>
<rect x="400" y="650" width="180" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="490" y="684.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">H₂</text>
<text x="490" y="710.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">4 байта</text>
<rect x="580" y="650" width="260" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="710" y="684.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">CRC[12]</text>
<text x="710" y="710.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">48 байт</text>
<rect x="840" y="650" width="360" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1020" y="684.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">D₀…D₉ | P₀ | P₁</text>
<text x="1020" y="710.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">12q байт</text>
<rect x="110" y="860" width="1020" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="620" y="901.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">RS защищает: S : u32 LE | Y | нулевое заполнение</text>
<text x="620" y="928.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Всего 10q информационных байтов; затем 2q проверочных.</text>
<text x="620" y="1062" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">S &lt; N: Y сжат. S = N: Y исходный. Сигнатура, флаги и таблица CRC32 не защищены RS.</text>
</svg>