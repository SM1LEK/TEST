<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1192" viewBox="0 0 1320 1192"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><rect x="30" y="24" width="1260" height="102" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="61.0">Архив: H | H | H | блок 0 | блок 1 | …</tspan><tspan x="50" y="92.9">H = CLARSv03 | flags (9 байт); первые 27 байт — троирование.</tspan></text><rect x="30" y="150" width="220" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="39" y="179.0">Режим</tspan></text><rect x="250" y="150" width="720" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="259" y="179.0">Физическая запись блока</tspan></text><rect x="970" y="150" width="320" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="979" y="179.0">Размер</tspan></text><rect x="30" y="220" width="220" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="249.0">Без RS</tspan></text><rect x="250" y="220" width="720" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="259" y="249.0">B (4 байта) | Y (S байт)</tspan></text><rect x="970" y="220" width="320" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="979" y="249.0">4 + S</tspan></text><rect x="30" y="290" width="220" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="319.0">С RS</tspan></text><rect x="250" y="290" width="720" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="259" y="319.0">RS(B) | RS(Y)</tspan></text><rect x="970" y="290" width="320" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="979" y="319.0">60 + 48 + 12q</tspan></text><rect x="30" y="360" width="220" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="389.0">Внутри RS(B)</tspan></text><rect x="250" y="360" width="720" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="259" y="389.0">CRC[12] | 12 фрагментов по 1 байту</tspan></text><rect x="970" y="360" width="320" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="979" y="389.0">48 + 12 = 60</tspan></text><rect x="30" y="430" width="220" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="459.0">Внутри RS(Y)</tspan></text><rect x="250" y="430" width="720" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="259" y="459.0">CRC[12] | 12 фрагментов по q байт</tspan></text><rect x="970" y="430" width="320" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="979" y="459.0">48 + 12q</tspan></text><rect x="30" y="528" width="1260" height="136" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="565.0">B = u16 LE(N−1) | u16 LE(S−1); 1 ≤ S ≤ N ≤ 65 536.</tspan><tspan x="50" y="596.9">q = ceil((S+4)/10). Размер S НЕ включает RS-избыточность.</tspan><tspan x="50" y="628.8">У заголовка блока и данных РАЗНЫЕ CRC-таблицы и parity.</tspan></text><rect x="30" y="688" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="39" y="717.0">Смещение от начала RS-блока</tspan></text><rect x="500" y="688" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="509" y="717.0">Длина</tspan></text><rect x="680" y="688" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#f1c779" text-anchor="start"><tspan x="689" y="717.0">Поле</tspan></text><rect x="30" y="745" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="774.0">0</tspan></text><rect x="500" y="745" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="509" y="774.0">48</tspan></text><rect x="680" y="745" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="689" y="774.0">CRC заголовка</tspan></text><rect x="30" y="802" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="831.0">48</tspan></text><rect x="500" y="802" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="509" y="831.0">12</tspan></text><rect x="680" y="802" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="689" y="831.0">Фрагменты заголовка</tspan></text><rect x="30" y="859" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="888.0">60</tspan></text><rect x="500" y="859" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="509" y="888.0">48</tspan></text><rect x="680" y="859" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="689" y="888.0">CRC данных</tspan></text><rect x="30" y="916" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="945.0">108</tspan></text><rect x="500" y="916" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="509" y="945.0">10q</tspan></text><rect x="680" y="916" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="689" y="945.0">Информационные фрагменты данных</tspan></text><rect x="30" y="973" width="470" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="39" y="1002.0">108 + 10q</tspan></text><rect x="500" y="973" width="180" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="509" y="1002.0">2q</tspan></text><rect x="680" y="973" width="610" height="57" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="689" y="1002.0">Проверочные фрагменты данных</tspan></text><rect x="30" y="1058" width="1260" height="102" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="1095.0">Два стирания в RS(B) и два в RS(Y) восстанавливаются независимо.</tspan><tspan x="50" y="1126.9">Три стирания в любом одном из этих слов → ошибка.</tspan></text></svg>