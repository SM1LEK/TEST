<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="663" viewBox="0 0 1200 663" role="img" aria-labelledby="title desc"><title id="title">Что означает предел «два фрагмента»</title><desc id="desc">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Что означает предел «два фрагмента»</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</text><rect x="30" y="125" width="610" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="42" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Повреждение</text>
<rect x="640" y="125" width="180" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="652" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Стирания</text>
<rect x="820" y="125" width="350" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="832" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Результат</text>
<rect x="30" y="176" width="610" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Много изменённых байтов в D₀</text>
<rect x="640" y="176" width="180" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">1</text>
<rect x="820" y="176" width="350" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Восстановление при корректных</text>
<text x="832" y="236" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">метках CRC</text>
<rect x="30" y="256" width="610" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">D₀ и D₁ повреждены</text>
<rect x="640" y="256" width="180" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2</text>
<rect x="820" y="256" width="350" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="287" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Восстановление по оставшимся</text>
<text x="832" y="316" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">10 фрагментам</text>
<rect x="30" y="336" width="610" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="367" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">По одному байту в D₀,D₁,D₂</text>
<rect x="640" y="336" width="180" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="367" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">3</text>
<rect x="820" y="336" width="350" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="367" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Отказ: e&gt;2</text>
<rect x="30" y="387" width="610" height="109" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="418" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Только одна запись таблицы CRC</text>
<rect x="640" y="387" width="180" height="109" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="418" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Обычно 1</text>
<text x="652" y="447" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ложное</text>
<rect x="820" y="387" width="350" height="109" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="418" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Может восстановить исправный</text>
<text x="832" y="447" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">фрагмент; CRC не</text>
<text x="832" y="476" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ремонтируется</text>
<rect x="30" y="496" width="610" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="527" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Ошибка с коллизией CRC</text>
<rect x="640" y="496" width="180" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="527" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Не отмечено</text>
<rect x="820" y="496" width="350" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="527" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Гарантии восстановления нет</text>
<rect x="30" y="547" width="610" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="578" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2 в RS(B) и 2 в RS(Y)</text>
<rect x="640" y="547" width="180" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="652" y="578" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2 + 2, разные</text>
<text x="652" y="607" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">слова</text>
<rect x="820" y="547" width="350" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="832" y="578" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Допустимо: бюджеты двух слов</text>
<text x="832" y="607" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">независимы</text></svg>