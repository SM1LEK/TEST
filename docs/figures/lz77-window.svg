<rect x="30" y="530" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="564" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Сопоставление цепочек</text>
<text x="50" y="601" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">X[0…3] = ABAB; X[2…5] = ABAB. Разность начал 2−0=2 — это d.</text>
<text x="50" y="632" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Начало совпадения находится в окне, его конец может выйти за текущую позицию p.</text>
<text x="50" y="663" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Остался X[6]=A: литерал обязателен. Следующая позиция p′=2+4+1=7.</text></svg>