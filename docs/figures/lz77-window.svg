<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="723" viewBox="0 0 1200 723" role="img" aria-labelledby="title desc"><title id="title">LZ77: окно и цепочка совпадения</title><desc id="desc">ABABABA; индексы с нуля; l=4,d=2,c=A. Байтовая ссылка допускает перекрытие.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">LZ77: окно и цепочка совпадения</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">ABABABA; индексы с нуля; l=4,d=2,c=A. Байтовая ссылка допускает перекрытие.</text><text x="50" y="150" font-family="Arial, sans-serif" font-size="23" fill="#84baff" text-anchor="start">Вход X: текущая позиция p=2</text>
