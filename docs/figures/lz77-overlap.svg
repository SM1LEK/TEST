<text x="162" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ABABA</text>
<rect x="550" y="329" width="300" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="562" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">5−2 = 3</text>
<rect x="850" y="329" width="320" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="862" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">B → ABABAB</text>
<rect x="30" y="380" width="120" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="411" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Литерал</text>
<rect x="150" y="380" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="162" y="411" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ABABAB</text>
<rect x="550" y="380" width="300" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="562" y="411" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Взять c из команды</text>
<rect x="850" y="380" width="320" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="862" y="411" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">A → ABABABA</text>
<rect x="30" y="455" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="489" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Проверка</text>
<text x="50" y="526" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Каждый шаг читает уже выросший буфер. При l &gt; d обычное копирование одного исходного среза</text>
<text x="50" y="557" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">неверно.</text></svg>