<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title desc"><title id="title">Перекрывающаяся ссылка: l=4, d=2</title><desc id="desc">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Перекрывающаяся ссылка: l=4, d=2</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</text><rect x="30" y="125" width="120" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="42" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Шаг</text>
<rect x="150" y="125" width="400" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="162" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Буфер перед шагом</text>
<rect x="550" y="125" width="300" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="562" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Индекс чтения</text>
<rect x="850" y="125" width="320" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="862" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Добавить</text>
<rect x="30" y="176" width="120" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">0</text>
<rect x="150" y="176" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="162" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">AB</text>
<rect x="550" y="176" width="300" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="562" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2−2 = 0</text>
<rect x="850" y="176" width="320" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="862" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">A → ABA</text>
<rect x="30" y="227" width="120" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">1</text>
<rect x="150" y="227" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="162" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ABA</text>
<rect x="550" y="227" width="300" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="562" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">3−2 = 1</text>
<rect x="850" y="227" width="320" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="862" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">B → ABAB</text>
<rect x="30" y="278" width="120" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">2</text>
<rect x="150" y="278" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="162" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">ABAB</text>
<rect x="550" y="278" width="300" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="562" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">4−2 = 2</text>
<rect x="850" y="278" width="320" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="862" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">A → ABABA</text>
<rect x="30" y="329" width="120" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">3</text>
