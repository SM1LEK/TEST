<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="547" viewBox="0 0 1200 547" role="img" aria-labelledby="title desc"><title id="title">Биты флагов и смещённые поля</title><desc id="desc">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Биты флагов и смещённые поля</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Десятичные числа; байты и состояния с пометкой hex — шестнадцатеричные.</text><rect x="30" y="125" width="260" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="42" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Поле</text>
<rect x="290" y="125" width="400" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="302" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Хранимая форма</text>
<rect x="690" y="125" width="480" height="51" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="702" y="158" font-family="Arial, sans-serif" font-size="21" fill="#84baff" text-anchor="start">Обратное преобразование</text>
<rect x="30" y="176" width="260" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Флаги, биты 7…0</text>
<rect x="290" y="176" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">0 0 0 0 0 RS rANS LZ77</text>
<rect x="690" y="176" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="207" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Биты 3…7 должны быть нулевыми</text>
<rect x="30" y="227" width="260" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Размер блока N</text>
<rect x="290" y="227" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">N−1: u16 little-endian</text>
<rect x="690" y="227" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="258" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">00 00 → 1; FF FF → 65536</text>
<rect x="30" y="278" width="260" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Размер данных S</text>
<rect x="290" y="278" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">S−1: u16 little-endian</text>
<rect x="690" y="278" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="309" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">S ≤ N; сжатие только при S &lt; N</text>
<rect x="30" y="329" width="260" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Число байтов</text>
<text x="42" y="389" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">алфавита D</text>
<rect x="290" y="329" width="400" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">D−1: u8</text>
<rect x="690" y="329" width="480" height="80" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="360" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">00 → 1; FF → 256</text>
<rect x="30" y="409" width="260" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Карта rANS, байт j</text>
<rect x="290" y="409" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Бит k отмечает байт 8j+k</text>
<rect x="690" y="409" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="440" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Биты от младшего k=0 к k=7</text>
<rect x="30" y="460" width="260" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="42" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">Байт LEB128</text>
<rect x="290" y="460" width="400" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="302" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">c b₆ b₅ b₄ b₃ b₂ b₁ b₀</text>
<rect x="690" y="460" width="480" height="51" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="702" y="491" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="start">c=1: продолжение; c=0: конец</text></svg>