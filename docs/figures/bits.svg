3afb9" stroke-width="1.5" pointer-events="none"/><rect x="65.75" y="720.75" width="1040" height="44" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="65.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="195.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="325.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="455.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="585.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="715.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="845.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="975.75" y="785.75" width="130" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="65.75" y="860.75" width="1040" height="48" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="65.75" y="925.75" width="1040" height="60" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="65.75" y="1006.75" width="330" height="75" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="420.75" y="1006.75" width="330" height="75" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><rect x="775.75" y="1006.75" width="330" height="75" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="76.6">Флаги этапов</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="130.75" y="146.4">7: 0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="260.75" y="146.4">6: 0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="390.75" y="146.4">5: 0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="520.75" y="146.4">4: 0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="650.75" y="146.4">3: 0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.75" y="146.4">2: RS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="910.75" y="146.4">1: rANS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1040.75" y="146.4">0: LZ77</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="217.9">Биты 0..=2: 1 - включён; 0 - выключен. Биты 3..=7: 0.</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="281.6">Unsigned LEB128 (varint)</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="130.75" y="351.4">C</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="260.75" y="351.4">b6</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="390.75" y="351.4">b5</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="520.75" y="351.4">b4</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="650.75" y="351.4">b3</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.75" y="351.4">b2</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="910.75" y="351.4">b1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1040.75" y="351.4">b0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="422.9">C = 1: есть следующий байт; C = 0: последний. Группы от младшей к старшей.</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="487.9">V = Σ_i ((b_i &amp; 0x7F) × 2^7i), i = 0..k−1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="551.6">Число символов rANS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="130.75" y="621.4">b7</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="260.75" y="621.4">b6</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="390.75" y="621.4">b5</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="520.75" y="621.4">b4</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="650.75" y="621.4">b3</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.75" y="621.4">b2</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="910.75" y="621.4">b1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1040.75" y="621.4">b0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="692.9">D = записанное значение + 1; диапазон D: 1..=256.</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="756.6">Битовая карта rANS</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="130.75" y="826.4">8j+7</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="260.75" y="826.4">8j+6</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="390.75" y="826.4">8j+5</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="520.75" y="826.4">8j+4</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="650.75" y="826.4">8j+3</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="780.75" y="826.4">8j+2</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="910.75" y="826.4">8j+1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1040.75" y="826.4">8j+0</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="897.9">Для символа s: j = floor(s / 8); бит = s mod 8. Всего 32 байта.</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="952.75">Поля записываются смещённым кодом: нулевое значение соответствует минимальному числу.</text><text x="585.75" y="974.75">Так в том же поле помещается верхняя граница диапазона.</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="230.75" y="1044.4">stored_N = N − 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="230.75" y="1070.4">N = stored_N + 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="1044.4">stored_S = S − 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="585.75" y="1070.4">S = stored_S + 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="940.75" y="1044.4">stored_D = D − 1</text></g><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="940.75" y="1070.4">D = stored_D + 1</text></g></svg>