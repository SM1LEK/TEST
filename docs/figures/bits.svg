<text x="495" y="225" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">4: 0</text>
<rect x="560" y="190" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="625" y="225" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">3: 0</text>
<rect x="690" y="190" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="755" y="225" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">2: RS</text>
<rect x="820" y="190" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="885" y="225" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">1: rANS</text>
<rect x="950" y="190" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1015" y="225" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">0: LZ77</text>
<text x="560" y="365" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Байт varint: старший бит C и 7 битов значения</text>
<rect x="40" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="105" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">C</text>
<rect x="170" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="235" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b6</text>
<rect x="300" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="365" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b5</text>
<rect x="430" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="495" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b4</text>
<rect x="560" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="625" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b3</text>
<rect x="690" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="755" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b2</text>
<rect x="820" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="885" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b1</text>
<rect x="950" y="420" width="130" height="70" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1015" y="455" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b0</text>
<rect x="110" y="565" width="900" height="130" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="603.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">C = 1: есть следующий байт; C = 0: последний</text>
<text x="560" y="630" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Группы идут от младшей к старшей</text>
<text x="560" y="656.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">V = Σ (byteᵢ AND 127) × 2⁷ⁱ</text>
<rect x="110" y="780" width="900" height="120" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="813.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">300 = 44 + 2 × 128</text>
<text x="560" y="840" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">300 → AC 02</text>
<text x="560" y="866.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">AC: C = 1, payload = 44; 02: C = 0, payload = 2</text>
<rect x="110" y="990" width="900" height="120" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1023.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Смещённые поля: N − 1, S − 1, D − 1</text>
<text x="560" y="1050" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">0 → минимальное значение 1</text>
<text x="560" y="1076.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">65535 → N или S = 65536; 255 → D = 256</text>
<text x="560" y="1212" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Varint u64: максимум 10 байт; в десятом только 00 или 01, без избыточной нулевой группы.</text>
</svg>