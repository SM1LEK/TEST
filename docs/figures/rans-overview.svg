<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="706" viewBox="0 0 1200 706" role="img" aria-labelledby="title desc"><title id="title">rANS: обратимые переходы состояния</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">rANS: обратимые переходы состояния</text><rect x="30" y="94" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Смысл величин</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">x — целое состояние; f — частота текущего байта; c — начало его интервала.</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">M=4096 — сумма частот; L=8388608 — начальное и конечное состояние.</text>
<rect x="30" y="244" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="278" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">Кодирование справа налево</text>
<text x="50" y="315" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Порог T(s)=524288·f(s). Пока x ≥ T(s): выдать x &amp; 255, затем x &gt;&gt;= 8.</text>
<text x="50" y="346" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">C_s(x)=floor(x/f)·4096 + (x mod f) + c.</text>
<rect x="30" y="394" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="428" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Декодирование слева направо</text>
<text x="50" y="465" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">q=x &amp; 4095. Найти s, для которого c(s) ≤ q &lt; c(s)+f(s).</text>
<text x="50" y="496" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">D_s(x)=f·floor(x/4096)+q−c. Пока x&lt;L: x ← 256x+очередной байт.</text>
<rect x="30" y="544" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="578" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Завершение</text>
<text x="50" y="615" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">В начале декодера L ≤ x &lt; 256L. После n байтов: x=L и поток исчерпан.</text>
<text x="50" y="646" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Состояние кодера — стек: последний закодированный байт восстанавливается первым.</text></svg>