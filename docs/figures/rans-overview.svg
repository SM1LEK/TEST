  <text x="560" y="629.88" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: M=4 096; M−D=4 093</text>
  <text x="560" y="656.06" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f⁰=(666₁₆, 333₁₆, 666₁₆); Σ=FFF₁₆</text>
  <text x="560" y="683.56" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: f⁰=(1 638, 819, 1 638); Σ=4 095</text>
  <text x="560" y="709.74" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Наибольший остаток у B: добавить 01₁₆</text>
  <text x="560" y="737.24" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Наибольший остаток у B: добавить 1</text>
  <text x="560" y="763.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=(666₁₆, 334₁₆, 666₁₆)</text>
  <text x="560" y="790.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: f=(1 638, 820, 1 638)</text>
