<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="974" viewBox="0 0 1120 974" role="img"><title>rANS • модель BANAN и интервалы символов</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 210 L560 275" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">rANS • модель BANAN и интервалы символов</text>
<path d="M 194 110 H 950 L 926 210 H 170 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="146.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход: ASCII BANAN; n = 5; D = 3</text>
<text x="560" y="173.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Число появлений: A = 2, B = 1, N = 2</text>
<rect x="170" y="275" width="780" height="145" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="307.24" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">M = 4096; M − D = 4093</text>
<text x="560" y="334.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f⁰ = (1638, 819, 1638); сумма 4095</text>
<text x="560" y="360.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Наибольший остаток у B: добавить 1</text>
<text x="560" y="387.76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f = (1638, 820, 1638)</text>
<rect x="40" y="520" width="416" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="248" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A</text>
<text x="248" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[0, 1638)</text>
<text x="248" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f = 1638</text>
<rect x="456" y="520" width="208" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">B</text>
<text x="560" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[1638, 2458)</text>
<text x="560" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f = 820</text>
<rect x="664" y="520" width="416" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="872" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N</text>
<text x="872" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[2458, 4096)</text>
<text x="872" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f = 1638</text>
<rect x="240" y="725" width="640" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="759.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">q = x mod 4096</text>
<text x="560" y="785.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выбрать s: c(s) ≤ q &lt; c(s) + f(s)</text>
<text x="560" y="902" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Это разбиение таблицы состояний rANS, не вложенное сужение интервала арифметического кодера.</text>
</svg>