  <text x="560" y="334.73999999999995" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">v(A)=02₁₆; v(B)=01₁₆; v(N)=02₁₆</text>
  <text x="560" y="362.23999999999995" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: v(A)=2; v(B)=1; v(N)=2</text>
