<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1530.0" viewBox="0 160 1120 1530" role="img">
  <title>rANS • модель BANAN и интервалы символов</title>
