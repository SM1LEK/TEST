  <text x="560" y="1163.4" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: [1 638, 2 458)</text>
  <text x="560" y="1189.5800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=334₁₆</text>
  <text x="560" y="1217.0800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: f=820</text>
  <rect x="664" y="1040.0" width="416" height="216.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="872" y="1094.32" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N</text>
  <text x="872" y="1135.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[99A₁₆, 2¹²)</text>
