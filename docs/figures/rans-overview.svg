  <text x="872" y="1189.5800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=666₁₆</text>
  <text x="872" y="1217.0800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: f=1 638</text>
  <rect x="240" y="1450.0" width="640" height="190.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1506.0600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">q = x mod 2¹²</text>
  <text x="560" y="1533.5600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: q = x mod 4 096</text>
  <text x="560" y="1571.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выбрать s: c(s) ≤ q &lt; c(s) + f(s)</text>
