<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="765" viewBox="0 80 1120 765" role="img">
  <title>rANS • модель BANAN и интервалы символов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="765.0" fill="#1f1e24" y="80" />
  <path d="M560 210 L560 275" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 194 110 H 950 L 926 210 H 170 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="146.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход: BANAN; n=0x05; D=0x03</text>
  <text x="560" y="173.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">v(A)=0x02; v(B)=0x01; v(N)=0x02</text>
  <rect x="170" y="275" width="780" height="145" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="307.24" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">M=0x1000; M−D=0xFFD</text>
  <text x="560" y="334.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f⁰=(0x666, 0x333, 0x666); Σ=0xFFF</text>
  <text x="560" y="360.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Наибольший остаток у B: добавить 0x01</text>
  <text x="560" y="387.76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=(0x666, 0x334, 0x666)</text>
  <rect x="40" y="520" width="416" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="248" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A</text>
  <text x="248" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[0x000, 0x666)</text>
  <text x="248" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=0x666</text>
  <rect x="456" y="520" width="208" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">B</text>
  <text x="560" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[0x666, 0x99A)</text>
  <text x="560" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=0x334</text>
  <rect x="664" y="520" width="416" height="108" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="872" y="547.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">N</text>
  <text x="872" y="574" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[0x99A, 0x1000)</text>
  <text x="872" y="600.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">f=0x666</text>
  <rect x="240" y="725" width="640" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="759.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">q = x mod 0x1000</text>
  <text x="560" y="785.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выбрать s: c(s) ≤ q &lt; c(s) + f(s)</text>
</svg>