<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1116" viewBox="0 0 1200 1116" role="img" aria-labelledby="title desc"><title id="title">Общий заголовок: побайтовое голосование</title><desc id="desc">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Общий заголовок: побайтовое голосование</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Прочитать 27 байт: H₀ | H₁ | H₂</text>
<rect x="240" y="250" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Для каждой позиции i=0…8</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">a=H₀[i], b=H₁[i], c=H₂[i]</text>
<polygon points="570.0,395 900,453.0 570.0,511 240,453.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="461.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">a=b или a=c?</text>
<rect x="240" y="564" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="608.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Да: результат[i]=a</text>
<rect x="240" y="689" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="728.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Иначе: b=c → результат[i]=b</text>
<text x="570.0" y="757.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Все три различны → ошибка</text>
<rect x="240" y="834" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="873.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">После 9 позиций проверить CLARSv03</text>
<text x="570.0" y="902.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">и отсутствие неизвестных битов флагов</text>
<rect x="240" y="979" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1023.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Получить режим архива</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 511 V 564" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="543" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 900 453.0 H 1033 V 735.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1043" y="441.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 240 600.0 H 156 V 880.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 781 V 834" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 926 V 979" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>