<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 80 1120 1060" role="img">
  <title>Заголовок блока • побайтовое голосование трёх копий</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="1060.0" fill="#1f1e24" y="80" />
  <path d="M560 200 L560 270" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 350 L560 420" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M340 470 L220 470 L220 605" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M780 470 L875 470 L875 595" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M875 695 L875 800" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M700 645 L620 645" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M220 685 L220 945 L560 945 L560 1010" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M875 880 L875 945 L560 945 L560 1010" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 344 110 H 800 L 776 200 H 320 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="141.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход: H₀ | H₁ | H₂</text>
  <text x="560" y="168.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Каждая копия — 4 байта</text>
  <rect x="140" y="270" width="840" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="310" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Для позиции i: a = H₀[i], b = H₁[i], c = H₂[i]</text>
  <path d="M 560.0 420 L 780 470.0 L 560.0 520 L 340 470.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="470" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">a = b или a = c?</text>
  <rect x="40" y="605" width="360" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="220" y="645" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат[i] = a</text>
  <path d="M 875.0 595 L 1050 645.0 L 875.0 695 L 700 645.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="875" y="645" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">b = c?</text>
  <rect x="700" y="800" width="350" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="875" y="840" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат[i] = b</text>
  <rect x="450" y="615" width="170" height="60" rx="30.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" ry="30.0" />
  <text x="535" y="645" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Ошибка</text>
  <text x="255" y="458" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
  <text x="824" y="458" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
  <text x="902" y="740" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
  <text x="665" y="624" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
  <path d="M 284 1010 H 860 L 836 1120 H 260 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1051.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Повторить для всех 4 позиций</text>
  <text x="560" y="1078.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">H = (N − 1) : u16 LE | (S − 1) : u16 LE</text>
</svg>