<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1082" viewBox="0 0 1202 1082"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><rect x="40.75" y="40.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="106.75">Подготовить 256 ячеек</text><text x="270.75" y="128.75">Для каждого индекса i от 0 до 255</text><text x="270.75" y="150.75">начать с c = i.</text></g><rect x="40.75" y="250.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="316.75">Обработать младший бит</text><text x="270.75" y="338.75">Если c AND 1 = 0: c = c &gt;&gt; 1.</text><text x="270.75" y="360.75">Иначе: c = (c &gt;&gt; 1) XOR 0xEDB88320.</text></g><rect x="40.75" y="460.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="526.75">Выполнить восемь шагов</text><text x="270.75" y="548.75">Повторить обработку бита 8 раз</text><text x="270.75" y="570.75">для текущего индекса i.</text></g><rect x="40.75" y="670.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="736.75">Сохранить элемент</text><text x="270.75" y="758.75">TABLE[i] = c.</text><text x="270.75" y="780.75">Перейти к следующему индексу.</text></g><rect x="40.75" y="880.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="946.75">Получить готовую таблицу</text><text x="270.75" y="968.75">256 значений для отражённого полинома.</text><text x="270.75" y="990.75">Таблица общая для всех расчётов.</text></g><rect x="700.75" y="40.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="117.75">Начальный регистр</text><text x="930.75" y="139.75">crc = 0xFFFFFFFF.</text></g><rect x="700.75" y="250.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="316.75">Взять очередной байт b</text><text x="930.75" y="338.75">Обрабатывать байты в исходном порядке.</text><text x="930.75" y="360.75">index = (crc AND 255) XOR b.</text></g><rect x="700.75" y="460.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="537.75">Обновить регистр</text><text x="930.75" y="559.75">crc = (crc &gt;&gt; 8) XOR TABLE[index].</text></g><rect x="700.75" y="670.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="736.75">Обработать весь вход</text><text x="930.75" y="758.75">Повторить шаги 2–3 для каждого байта.</text><text x="930.75" y="780.75">Таблица заменяет восемь битовых шагов.</text></g><rect x="700.75" y="880.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="946.75">Завершить расчёт</text><text x="930.75" y="968.75">CRC = NOT crc (инверсия 32 бит).</text><text x="930.75" y="990.75">Для пустого входа результат равен 0.</text></g><path d="M 270.75 200.75 L 270.75 239.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 249.07 L 266 239.57 L 275.5 239.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 410.75 L 270.75 449.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 459.07 L 266 449.57 L 275.5 449.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 620.75 L 270.75 659.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 669.07 L 266 659.57 L 275.5 659.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 830.75 L 270.75 869.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 879.07 L 266 869.57 L 275.5 869.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 200.75 L 930.75 239.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 249.07 L 926 239.57 L 935.5 239.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 410.75 L 930.75 449.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 459.07 L 926 449.57 L 935.5 449.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 620.75 L 930.75 659.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 669.07 L 926 659.57 L 935.5 659.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 830.75 L 930.75 869.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 879.07 L 926 869.57 L 935.5 869.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 500.75 960.75 L 600.75 960.75 L 600.75 120.75 L 689.57 120.75" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 699.07 120.75 L 689.57 125.5 L 689.57 116 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/></svg>