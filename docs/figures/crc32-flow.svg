<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 80 1120 780" role="img">
  <title>CRC32 • обнаружение повреждённых RS-фрагментов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="780.0" fill="#1f1e24" y="80" />
  <path d="M560 170 L560 218" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 298 L560 346" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 446 L560 494" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 594 L560 642" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 737 L560 785" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M840 544 L920 544 L920 258 L828 258" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="280" y="110" width="560" height="60" rx="30.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="140" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Начало; crc = 0xFFFFFFFF</text>
  <path d="M 304 218 H 840 L 816 298 H 280 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Очередной байт b фрагмента</text>
  <rect x="280" y="346" width="560" height="100" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="382.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">index = (crc AND 255) XOR b</text>
  <text x="560" y="409.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">crc = (crc &gt;&gt; 8) XOR TABLE[index]</text>
  <path d="M 560.0 494 L 840 544.0 L 560.0 594 L 280 544.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="544" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Остались байты?</text>
  <path d="M 304 642 H 840 L 816 737 H 280 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="676.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат = crc XOR 0xFFFFFFFF</text>
  <text x="560" y="702.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать u32 little-endian</text>
  <rect x="280" y="785" width="560" height="50" rx="25.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="810" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Конец</text>
  <text x="935" y="450" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
  <text x="600" y="615" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
</svg>