<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1560.0" viewBox="0 160 1120 1560" role="img">
  <title>CRC32 • обнаружение повреждённых RS-фрагментов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="1560.0" fill="#1f1e24" y="160.0" />
  <path d="M560 170 L560 218" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 298 L560 346" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 446 L560 494" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 594 L560 642" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 737 L560 785" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M840 544 L920 544 L920 258 L828 258" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <rect x="280" y="220.0" width="560" height="120.0" rx="60.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" ry="60.0" />
  <text x="560" y="267.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Начало; crc = FFFF FFFF₁₆</text>
  <text x="560" y="295.4" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Начало; crc = 4 294 967 295</text>
  <path d="M 304 218 H 840 L 816 298 H 280 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="516.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Очередной байт b фрагмента</text>
  <rect x="280" y="692.0" width="560" height="200.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="765.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">index = (crc AND 255) XOR b</text>
  <text x="560" y="818.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">crc = (crc &gt;&gt; 8) XOR TABLE[index]</text>
  <path d="M 560.0 494 L 840 544.0 L 560.0 594 L 280 544.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="1088.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Остались байты?</text>
  <path d="M 304 642 H 840 L 816 737 H 280 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="1340.0600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Результат = crc XOR FFFF FFFF₁₆</text>
  <text x="560" y="1367.5600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Результат = crc XOR 4 294 967 295</text>
  <text x="560" y="1405.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать u32 little-endian</text>
  <rect x="280" y="1570.0" width="560" height="100.0" rx="50.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" ry="50.0" />
  <text x="560" y="1620.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Конец</text>
  <text x="935" y="900.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
  <text x="600" y="1230.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
</svg>