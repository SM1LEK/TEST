<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="971" viewBox="0 0 1200 971" role="img" aria-labelledby="title desc"><title id="title">CRC32: логически эквивалентный побитовый алгоритм</title><desc id="desc">crc32fast может использовать таблицы и аппаратное ускорение; результат тот же.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">CRC32: логически эквивалентный побитовый алгоритм</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">crc32fast может использовать таблицы и аппаратное ускорение; результат тот же.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало; crc=FFFFFFFF hex</text>
<polygon points="570.0,250 900,308.0 570.0,366 240,308.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="316.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Остался байт b?</text>
<rect x="240" y="419" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="463.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">crc ← crc XOR b</text>
<rect x="240" y="544" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="583.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">8 раз: если crc&amp;1=1,</text>
<text x="570.0" y="612.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">crc ← (crc&gt;&gt;1) XOR EDB88320; иначе crc&gt;&gt;=1</text>
<polygon points="265,689 900,689 875,781 240,781" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="728.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Результат: crc XOR FFFFFFFF</text>
<text x="570.0" y="757.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">В таблице архива — u32 little-endian</text>
<rect x="240" y="834" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="878.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Конец</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 366 V 419" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="398" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 491 V 544" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 240 590.0 H 167 V 308.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="155" y="578.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Следующий</text>
<path d="M 900 308.0 H 1044 V 735.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1054" y="296.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 781 V 834" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>