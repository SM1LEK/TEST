<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1158" viewBox="0 0 1202 1158"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="265.75" y="74.75">Кодирование</text></g><rect x="40.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="171.75">Построить модель</text><text x="270.75" y="193.75">Подсчитать и нормализовать частоты.</text><text x="270.75" y="215.75">Найти начала интервалов c(s).</text><text x="270.75" y="237.75">Начальное состояние x = L.</text></g><rect x="40.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="392.75">Взять символ с конца</text><text x="270.75" y="414.75">Обрабатывать вход справа налево.</text><text x="270.75" y="436.75">Для символа взять f(s) и c(s).</text></g><rect x="40.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="602.75">Перенормировать состояние</text><text x="270.75" y="624.75">Пока x &gt;= 524288 × f(s):</text><text x="270.75" y="646.75">выдать x mod 256; x = floor(x / 256).</text></g><rect x="40.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="801.75">Закодировать символ</text><text x="270.75" y="823.75">x = floor(x / f(s)) × 4096</text><text x="270.75" y="845.75">+ (x mod f(s)) + c(s)</text><text x="270.75" y="867.75">Повторять шаги 2–4 для всего входа.</text></g><rect x="40.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="1022.75">Записать выходной поток</text><text x="270.75" y="1044.75">Длина, модель, конечное x (LE).</text><text x="270.75" y="1066.75">Выданные байты - в обратном порядке.</text></g><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="925.75" y="74.75">Декодирование</text></g><rect x="700.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="182.75">Прочитать модель и состояние</text><text x="930.75" y="204.75">Восстановить f(s), c(s) и состояние x.</text><text x="930.75" y="226.75">Построить таблицу на 4096 ячеек.</text></g><rect x="700.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="381.75">Найти и вывести символ</text><text x="930.75" y="403.75">q = x mod 4096.</text><text x="930.75" y="425.75">Выбрать s: c(s) &lt;= q &lt; c(s) + f(s).</text><text x="930.75" y="447.75">Добавить s к результату.</text></g><rect x="700.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="602.75">Обратить переход</text><text x="930.75" y="624.75">x = f(s) × floor(x / 4096)</text><text x="930.75" y="646.75">+ q − c(s)</text></g><rect x="700.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="801.75">Перенормировать состояние</text><text x="930.75" y="823.75">Пока x &lt; L: прочитать байт b;</text><text x="930.75" y="845.75">x = 256 × x + b.</text><text x="930.75" y="867.75">Повторять шаги 2–4 до длины N.</text></g><rect x="700.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="1011.75">Завершить поток</text><text x="930.75" y="1033.75">Проверить x = L.</text><text x="930.75" y="1055.75">Все входные байты должны быть</text><text x="930.75" y="1077.75">прочитаны.</text></g><path d="M 270.75 276.75 L 270.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 325.07 L 266 315.57 L 275.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 486.75 L 270.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 535.07 L 266 525.57 L 275.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 696.75 L 270.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 745.07 L 266 735.57 L 275.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 906.75 L 270.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 955.07 L 266 945.57 L 275.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 276.75 L 930.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 325.07 L 926 315.57 L 935.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 486.75 L 930.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 535.07 L 926 525.57 L 935.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 696.75 L 930.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 745.07 L 926 735.57 L 935.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 906.75 L 930.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 955.07 L 926 945.57 L 935.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/></svg>