    </ns0:g>
    <ns0:g data-vertex-id="n2">
      <ns0:desc>Построить модель
Подсчитать и нормализовать частоты.
Найти начала интервалов c(s).
Начальное состояние x = L.</ns0:desc>
      <ns0:rect x="80" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="145.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Построить модель</ns0:text>
      <ns0:text x="310" y="173.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Подсчитать и нормализовать частоты.</ns0:text>
      <ns0:text x="310" y="201.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Найти начала интервалов c(s).</ns0:text>
      <ns0:text x="310" y="229.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Начальное состояние x = L.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n3">
      <ns0:desc>Взять символ с конца
Обрабатывать вход справа налево.
Для символа взять f(s) и c(s).</ns0:desc>
      <ns0:rect x="80" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="369.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Взять символ с конца</ns0:text>
      <ns0:text x="310" y="397.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Обрабатывать вход справа налево.</ns0:text>
      <ns0:text x="310" y="425.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Для символа взять f(s) и c(s).</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n4">
      <ns0:desc>Перенормировать состояние
Пока x &gt;= 524288 × f(s):
выдать x mod 256; x = floor(x / 256).</ns0:desc>
      <ns0:rect x="80" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Перенормировать состояние</ns0:text>
      <ns0:text x="310" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Пока x &gt;= 524288 × f(s):</ns0:text>
      <ns0:text x="310" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">выдать x mod 256; x = floor(x / 256).</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n5">
      <ns0:desc>Закодировать символ
x = floor(x / f(s)) × 4096
+ (x mod f(s)) + c(s)
Повторять шаги 2–4 для всего входа.</ns0:desc>
      <ns0:rect x="80" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="775.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Закодировать символ</ns0:text>
      <ns0:text x="310" y="803.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">x = floor(x / f(s)) × 4096</ns0:text>
      <ns0:text x="310" y="831.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">+ (x mod f(s)) + c(s)</ns0:text>
      <ns0:text x="310" y="859.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Повторять шаги 2–4 для всего входа.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n6">
      <ns0:desc>Записать выходной поток
Длина, модель, конечное x (LE).
Выданные байты - в обратном порядке.</ns0:desc>
      <ns0:rect x="80" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать выходной поток</ns0:text>
      <ns0:text x="310" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Длина, модель, конечное x (LE).</ns0:text>
      <ns0:text x="310" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Выданные байты - в обратном порядке.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n7">
      <ns0:desc>Декодирование</ns0:desc>
      <ns0:text x="965" y="54.84" text-anchor="middle" font-family="Arial" font-size="26px" fill="#ececef" font-weight="bold">Декодирование</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n8">
      <ns0:desc>Прочитать модель и состояние
Восстановить f(s), c(s) и состояние x.
Построить таблицу на 4096 ячеек.</ns0:desc>
      <ns0:rect x="740" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать модель и состояние</ns0:text>
      <ns0:text x="970" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Восстановить f(s), c(s) и состояние x.</ns0:text>
      <ns0:text x="970" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Построить таблицу на 4096 ячеек.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n9">
      <ns0:desc>Найти и вывести символ
q = x mod 4096.
Выбрать s: c(s) &lt;= q &lt; c(s) + f(s).
Добавить s к результату.</ns0:desc>
      <ns0:rect x="740" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="355.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Найти и вывести символ</ns0:text>
      <ns0:text x="970" y="383.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">q = x mod 4096.</ns0:text>
      <ns0:text x="970" y="411.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Выбрать s: c(s) &lt;= q &lt; c(s) + f(s).</ns0:text>
      <ns0:text x="970" y="439.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Добавить s к результату.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n10">
      <ns0:desc>Обратить переход
x = f(s) × floor(x / 4096)
+ q − c(s)</ns0:desc>
      <ns0:rect x="740" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Обратить переход</ns0:text>
      <ns0:text x="970" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">x = f(s) × floor(x / 4096)</ns0:text>
      <ns0:text x="970" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">+ q − c(s)</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n11">
      <ns0:desc>Перенормировать состояние
Пока x &lt; L: прочитать байт b;
x = 256 × x + b.
Повторять шаги 2–4 до длины N.</ns0:desc>
      <ns0:rect x="740" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="775.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Перенормировать состояние</ns0:text>
      <ns0:text x="970" y="803.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Пока x &lt; L: прочитать байт b;</ns0:text>
      <ns0:text x="970" y="831.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">x = 256 × x + b.</ns0:text>
      <ns0:text x="970" y="859.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Повторять шаги 2–4 до длины N.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n12">
      <ns0:desc>Завершить поток
Проверить x = L.
Все входные байты должны быть
прочитаны.</ns0:desc>
      <ns0:rect x="740" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="985.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Завершить поток</ns0:text>
      <ns0:text x="970" y="1013.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить x = L.</ns0:text>
      <ns0:text x="970" y="1041.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Все входные байты должны быть</ns0:text>
      <ns0:text x="970" y="1069.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">прочитаны.</ns0:text>
