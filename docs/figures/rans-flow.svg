<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1669" viewBox="0 0 1380 1669" role="img"><title>rANS • взаимно обратные переходы, n &gt; 0</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M320 250 L320 300" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 400 L320 450" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 530 L320 580" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 680 L320 740" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 825 L320 855 L35 855 L35 630 L70 630" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M570 630 L620 630 L620 930 L570 930" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 985 L320 1030 L680 1030 L680 350 L570 350" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M70 350 L15 350 L15 1080 L320 1080 L320 1135" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 250 L1060 300" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 400 L1060 450" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 530 L1060 580" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 680 L1060 740" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 825 L1060 875" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 985 L1060 1040 L765 1040 L765 782.5 L810 782.5" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1310 782.5 L1350 782.5 L1350 1090 L1060 1090 L1060 1135" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060 1240 L1060 1280 L1370 1280 L1370 350 L1310 350" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M810 350 L725 350 L725 1330 L1060 1330 L1060 1390" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">rANS • взаимно обратные переходы, n &gt; 0</text>
<text x="330" y="112.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Кодирование: справа налево</text>
<text x="1050" y="112.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">Декодирование: слева направо</text>
<rect x="70" y="170" width="500" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="210" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x = L = 2²³; i = n − 1</text>
<path d="M 320.0 300 L 570 350.0 L 320.0 400 L 70 350.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">i ≥ 0?</text>
<rect x="70" y="450" width="500" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="490" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">s = X[i]; f = f(s); c = c(s)</text>
<path d="M 320.0 580 L 570 630.0 L 320.0 680 L 70 630.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="630" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x ≥ 2¹⁹ × f?</text>
<rect x="70" y="740" width="500" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="769.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выдать x mod 256</text>
<text x="320" y="795.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x = floor(x / 256)</text>
<rect x="70" y="875" width="500" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="903.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x = floor(x / f) × 4096</text>
<text x="320" y="930" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">+ (x mod f) + c</text>
<text x="320" y="956.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">i = i − 1</text>
<path d="M 94 1135 H 570 L 546 1240 H 70 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="320" y="1174.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать n, модель, x (u32 LE)</text>
<text x="320" y="1200.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выданные байты — в обратном порядке</text>
<rect x="810" y="170" width="500" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="196.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать n, модель, x</text>
<text x="1060" y="223.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Проверить L ≤ x &lt; 256L; k = 0</text>
<path d="M 1060.0 300 L 1310 350.0 L 1060.0 400 L 810 350.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">k &lt; n?</text>
<rect x="810" y="450" width="500" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="476.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">q = x mod 4096</text>
<text x="1060" y="503.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Найти s; выдать s</text>
<rect x="810" y="580" width="500" height="100" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="616.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x = f(s) × floor(x / 4096)</text>
<text x="1060" y="643.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">+ q − c(s)</text>
<path d="M 1060.0 740 L 1310 782.5 L 1060.0 825 L 810 782.5 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="782.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">x &lt; L?</text>
<path d="M 834 875 H 1310 L 1286 985 H 810 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="930" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать b; x = 256x + b</text>
<rect x="810" y="1135" width="500" height="105" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="1187.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">k = k + 1</text>
<text x="350" y="426" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="350" y="716" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="648" y="700" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<text x="50" y="1030" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<text x="1090" y="426" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="1090" y="851" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="1325" y="1060" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<rect x="810" y="1390" width="500" height="125" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1060" y="1425.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Проверить x = L</text>
<text x="1060" y="1452.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">и отсутствие непрочитанных байтов</text>
<text x="1060" y="1479.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выход: n исходных байтов</text>
<text x="753" y="1280" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<text x="690" y="1597" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Ошибочный заголовок, нехватка байтов или невыполненные конечные проверки → ошибка.</text>
</svg>