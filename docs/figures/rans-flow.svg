<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1285" viewBox="0 0 1200 1285" role="img" aria-labelledby="title desc"><title id="title">rANS: кодирование</title><desc id="desc">Для n&gt;0. Пустой вход: encode → 00; без модели и состояния.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">rANS: кодирование</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Для n&gt;0. Пустой вход: encode → 00; без модели и состояния.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало</text>
<rect x="240" y="250" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Подсчитать v; нормализовать f до 4096</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Построить c; x=L; идти с конца входа</text>
<polygon points="570.0,395 900,453.0 570.0,511 240,453.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="461.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Остался символ s?</text>
<polygon points="570.0,564 900,622.0 570.0,680 240,622.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="630.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">x ≥ 524288·f(s)?</text>
<rect x="240" y="733" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="777.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Выдать младший байт; x &gt;&gt;= 8</text>
<rect x="240" y="858" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="897.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">x ← floor(x/f)·4096 + x%f + c</text>
<text x="570.0" y="926.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Перейти к предыдущему символу</text>
<polygon points="265,1003 900,1003 875,1095 240,1095" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="1042.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Записать n, модель, x:u32 LE</text>
<text x="570.0" y="1071.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Затем выданные байты в обратном порядке</text>
<rect x="240" y="1148" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1192.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть поток</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 511 V 564" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="543" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 680 V 733" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="712" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 240 769.0 H 156 V 622.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="144" y="757.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Повтор</text>
<path d="M 900 622.0 H 1055 V 904.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1065" y="610.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 240 904.0 H 134 V 453.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="122" y="892.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Следующий</text>
<path d="M 900 453.0 H 1077 V 1049.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1087" y="441.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 1095 V 1148" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>