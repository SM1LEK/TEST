<text x="50" y="373" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Первые 10 строк G — единичная матрица I₁₀. Здесь показаны две проверочные строки.</text>
<text x="50" y="404" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">V[i,k]=iᵏ в GF(256); T=V[0…9,:]; G=V·T⁻¹.</text>
<text x="50" y="435" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Для каждого смещения j: P_r[j] = XOR_k (G[10+r,k]·D_k[j]).</text></svg>