<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1870.0" viewBox="0 0 1320 1870"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b3afb9" /></marker></defs><rect width="100%" height="100%" fill="#1f1e24" /><rect x="30" y="50.0" width="1260" height="340.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="111.9">CRC пометила D₀ и D₁ отсутствующими; e = 02₁₆</tspan><tspan x="50" y="139.4" font-size="20.0" fill="#bbb6c3">₁₀: CRC пометила D₀ и D₁ отсутствующими; e = 2</tspan><tspan x="50" y="175.70000000000002">P₀ = BD₁₆; P₁ = 94₁₆; остальные 0A₁₆ фрагментов известны</tspan><tspan x="50" y="203.20000000000002" font-size="20.0" fill="#bbb6c3">₁₀: P₀ = 189; P₁ = 148; остальные 10 фрагментов известны</tspan><tspan x="50" y="239.5">Известная часть P₀: 9C₁₆; известная часть P₁: C7₁₆</tspan><tspan x="50" y="267.0" font-size="20.0" fill="#bbb6c3">₁₀: Известная часть P₀: 156; известная часть P₁: 199</tspan><tspan x="50" y="303.29999999999995">y₀ = BD₁₆ XOR 9C₁₆ = 21₁₆; y₁ = 94₁₆ XOR C7₁₆ = 53₁₆</tspan><tspan x="50" y="330.79999999999995" font-size="20.0" fill="#bbb6c3">₁₀: y₀ = 189 XOR 156 = 33; y₁ = 148 XOR 199 = 83</tspan></text><rect x="30" y="438.0" width="1260" height="340.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="499.9">81₁₆ × D₀ XOR 96₁₆ × D₁ = 21₁₆</tspan><tspan x="50" y="527.4" font-size="20.0" fill="#bbb6c3">₁₀: 129 × D₀ XOR 150 × D₁ = 33</tspan><tspan x="50" y="563.6999999999999">96₁₆ × D₀ XOR 81₁₆ × D₁ = 53₁₆</tspan><tspan x="50" y="591.1999999999999" font-size="20.0" fill="#bbb6c3">₁₀: 150 × D₀ XOR 129 × D₁ = 83</tspan><tspan x="50" y="627.5">det A = 81₁₆ × 81₁₆ XOR 96₁₆ × 96₁₆ = 08₁₆</tspan><tspan x="50" y="655.0" font-size="20.0" fill="#bbb6c3">₁₀: det A = 129 × 129 XOR 150 × 150 = 8</tspan><tspan x="50" y="691.3">(08₁₆)⁻¹ = AD₁₆; 08₁₆ × AD₁₆ = 01₁₆</tspan><tspan x="50" y="718.8" font-size="20.0" fill="#bbb6c3">₁₀: (8)⁻¹ = 173; 8 × 173 = 1</tspan></text><rect x="30" y="826.0" width="250" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="39" y="880.0" /></text><rect x="280" y="826.0" width="330" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="289" y="880.0">A</tspan></text><rect x="610" y="826.0" width="680" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#f1c779" text-anchor="start"><tspan x="619" y="880.0">A⁻¹ = (det A)⁻¹ × adj A</tspan></text><rect x="30" y="914.0" width="250" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="957.0">Строка 00₁₆</tspan><tspan x="39" y="982.0" font-size="18.0" fill="#bbb6c3">₁₀: Строка 0</tspan></text><rect x="280" y="914.0" width="330" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="289" y="957.0">81 96</tspan><tspan x="289" y="982.0" font-size="18.0" fill="#bbb6c3">₁₀: 129 150</tspan></text><rect x="610" y="914.0" width="680" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="619" y="957.0">BD DB</tspan><tspan x="619" y="982.0" font-size="18.0" fill="#bbb6c3">₁₀: 189 219</tspan></text><rect x="30" y="1002.0" width="250" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="39" y="1045.0">Строка 01₁₆</tspan><tspan x="39" y="1070.0" font-size="18.0" fill="#bbb6c3">₁₀: Строка 1</tspan></text><rect x="280" y="1002.0" width="330" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="289" y="1045.0">96 81</tspan><tspan x="289" y="1070.0" font-size="18.0" fill="#bbb6c3">₁₀: 150 129</tspan></text><rect x="610" y="1002.0" width="680" height="88.0" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4" /><text font-family="Arial" font-size="20" fill="#ececef" text-anchor="start"><tspan x="619" y="1045.0">DB BD</tspan><tspan x="619" y="1070.0" font-size="18.0" fill="#bbb6c3">₁₀: 219 189</tspan></text><rect x="30" y="1146.0" width="1260" height="340.0" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="1207.9">D₀ = BD₁₆ × 21₁₆ XOR DB₁₆ × 53₁₆</tspan><tspan x="50" y="1235.4" font-size="20.0" fill="#bbb6c3">₁₀: D₀ = 189 × 33 XOR 219 × 83</tspan><tspan x="50" y="1271.7">      = 83₁₆ XOR 85₁₆ = 06₁₆</tspan><tspan x="50" y="1299.2" font-size="20.0" fill="#bbb6c3">₁₀:       = 131 XOR 133 = 6</tspan><tspan x="50" y="1335.5">D₁ = DB₁₆ × 21₁₆ XOR BD₁₆ × 53₁₆</tspan><tspan x="50" y="1363.0" font-size="20.0" fill="#bbb6c3">₁₀: D₁ = 219 × 33 XOR 189 × 83</tspan><tspan x="50" y="1399.3000000000002">      = B9₁₆ XOR B9₁₆ = 00₁₆</tspan><tspan x="50" y="1426.8000000000002" font-size="20.0" fill="#bbb6c3">₁₀:       = 185 XOR 185 = 0</tspan></text><rect x="30" y="1534.0" width="1260" height="272.0" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4" /><text font-family="Arial" font-size="22" fill="#ececef" text-anchor="start"><tspan x="50" y="1595.9">D = 06 00 00 00 41 42 43 44 45 46</tspan><tspan x="50" y="1623.4" font-size="20.0" fill="#bbb6c3">₁₀: D = 6 0 0 0 65 66 67 68 69 70</tspan><tspan x="50" y="1659.7">S : u32 LE = 0000 0006₁₆; снять префикс длины</tspan><tspan x="50" y="1687.2" font-size="20.0" fill="#bbb6c3">₁₀: S : u32 LE = 6; снять префикс длины</tspan><tspan x="50" y="1723.5">Вернуть 41 42 43 44 45 46 = ABCDEF; e = 02₁₆</tspan><tspan x="50" y="1751.0" font-size="20.0" fill="#bbb6c3">₁₀: Вернуть 65 66 67 68 69 70 = ABCDEF; e = 2</tspan></text></svg>