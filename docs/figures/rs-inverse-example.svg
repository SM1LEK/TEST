<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="737" viewBox="0 0 1200 737" role="img" aria-labelledby="title desc"><title id="title">RS: восстановление двух стираний D₀ и D₁</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">RS: восстановление двух стираний D₀ и D₁</text><rect x="30" y="94" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Убрать известные слагаемые</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">P₀=BD, известная часть 9C → y₀=BD XOR 9C=21.</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">P₁=94, известная часть C7 → y₁=94 XOR C7=53. Все числа здесь hex.</text>
<rect x="30" y="244" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="278" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">Система над GF(256)</text>
<text x="50" y="315" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">81·D₀ XOR 96·D₁ = 21; 96·D₀ XOR 81·D₁ = 53.</text>
<text x="50" y="346" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">det A=81·81 XOR 96·96=08; 08⁻¹=AD.</text>
<text x="50" y="377" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">A⁻¹ = [ BD DB ; DB BD ].</text>
<rect x="30" y="425" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="459" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Восстановить неизвестные</text>
<text x="50" y="496" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">D₀=BD·21 XOR DB·53 = 83 XOR 85 = 06.</text>
<text x="50" y="527" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">D₁=DB·21 XOR BD·53 = B9 XOR B9 = 00.</text>
<rect x="30" y="575" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="609" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Снять служебные данные</text>
<text x="50" y="646" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">D = 06 00 00 00 41 42 43 44 45 46. Внутренняя длина — 6.</text>
<text x="50" y="677" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Отбросить длину и заполнение: вернуть ABCDEF. Исправлено 2 фрагмента.</text></svg>