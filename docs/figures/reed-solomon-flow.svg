<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="1053" viewBox="48 75 1184 1053" role="img">
  <title>reed-solomon-flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect id="background" x="48" y="75" width="1184" height="1053.0" fill="#1f1e24" />
  <g id="drawing">
    <path d="M 310 260 L 310 310" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e0" data-source="n2" data-target="n3" />
    <path d="M 310 470 L 310 520" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e1" data-source="n3" data-target="n4" />
    <path d="M 310 680 L 310 730" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e2" data-source="n4" data-target="n5" />
    <path d="M 310 890 L 310 940" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e3" data-source="n5" data-target="n6" />
    <path d="M 970 260 L 970 310" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e4" data-source="n8" data-target="n9" />
    <path d="M 970 470 L 970 520" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e5" data-source="n9" data-target="n10" />
    <path d="M 970 680 L 970 730" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e6" data-source="n10" data-target="n11" />
    <path d="M 970 890 L 970 940" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" data-edge-id="e7" data-source="n11" data-target="n12" />
    <g data-vertex-id="n2">
      <desc>Подготовить S : u32 LE и payload
q = ceil((S + 4) / 10)
Дополнить нулями до 10q байт</desc>
      <rect x="80" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="310" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Подготовить S : u32 LE и payload</text>
      <text x="310" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">q = ceil((S + 4) / 10)</text>
      <text x="310" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Дополнить нулями до 10q байт</text>
    </g>
    <g data-vertex-id="n3">
      <desc>Разделить на D0 ... D9
10 равных фрагментов по q байт
Операции в GF(256)</desc>
      <rect x="80" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="310" y="369.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Разделить на D0 ... D9</text>
      <text x="310" y="397.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">10 равных фрагментов по q байт</text>
      <text x="310" y="425.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Операции в GF(256)</text>
    </g>
    <g data-vertex-id="n4">
      <desc>Вычислить P0 и P1
Два проверочных фрагмента
P[j] = Gp × D[j] в GF(256)</desc>
      <rect x="80" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="310" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вычислить P0 и P1</text>
      <text x="310" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Два проверочных фрагмента</text>
      <text x="310" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">P[j] = Gp × D[j] в GF(256)</text>
    </g>
    <g data-vertex-id="n5">
      <desc>Вычислить CRC32 фрагментов
12 контрольных сумм u32 LE
CRC находится вне RS</desc>
      <rect x="80" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="310" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вычислить CRC32 фрагментов</text>
      <text x="310" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">12 контрольных сумм u32 LE</text>
      <text x="310" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">CRC находится вне RS</text>
    </g>
    <g data-vertex-id="n6">
      <desc>Записать защищённые данные
CRC32[12] | D0 ... D9 | P0 | P1
Заголовок блока — три копии</desc>
      <rect x="80" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="310" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать защищённые данные</text>
      <text x="310" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">CRC32[12] | D0 ... D9 | P0 | P1</text>
      <text x="310" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Заголовок блока — три копии</text>
    </g>
    <g data-vertex-id="n8">
      <desc>Прочитать CRC и 12 фрагментов
q задаётся размером блока
Несовпадение CRC — стирание</desc>
      <rect x="740" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="970" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать CRC и 12 фрагментов</text>
      <text x="970" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">q задаётся размером блока</text>
      <text x="970" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Несовпадение CRC — стирание</text>
    </g>
    <g data-vertex-id="n9">
      <desc>Проверить число стираний e
e &gt; 2: ошибка; e = 0: без ремонта
e = 1 или 2: reconstruct</desc>
      <rect x="740" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="970" y="369.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить число стираний e</text>
      <text x="970" y="397.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">e &gt; 2: ошибка; e = 0: без ремонта</text>
      <text x="970" y="425.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">e = 1 или 2: reconstruct</text>
    </g>
    <g data-vertex-id="n10">
      <desc>Собрать D0 ... D9
Прочитать внутренний размер S
Проверить S ≤ 10q − 4; взять Y</desc>
      <rect x="740" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="970" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Собрать D0 ... D9</text>
      <text x="970" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать внутренний размер S</text>
      <text x="970" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить S ≤ 10q − 4; взять Y</text>
    </g>
    <g data-vertex-id="n11">
      <desc>Восстановить исходный блок
Только при S &lt; N: rANS → LZ77
При S = N сжатие пропускается</desc>
      <rect x="740" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="970" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Восстановить исходный блок</text>
      <text x="970" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Только при S &lt; N: rANS → LZ77</text>
      <text x="970" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">При S = N сжатие пропускается</text>
    </g>
    <g data-vertex-id="n12">
      <desc>Проверить длину результата N
Вернуть данные и число e
Счётчик — фрагменты, не байты</desc>
      <rect x="740" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <text x="970" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить длину результата N</text>
      <text x="970" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вернуть данные и число e</text>
      <text x="970" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Счётчик — фрагменты, не байты</text>
    </g>
  </g>
</svg>