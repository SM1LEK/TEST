    <ns0:g data-vertex-id="n1">
      <ns0:desc>Кодирование</ns0:desc>
      <ns0:text x="305" y="54.84" text-anchor="middle" font-family="Arial" font-size="26px" fill="#ececef" font-weight="bold">Кодирование</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n2">
      <ns0:desc>Подготовить S : u32 LE и payload
q = ceil((S + 4) / 10)
Дополнить нулями до 10q байт</ns0:desc>
      <ns0:rect x="80" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="310" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Подготовить S : u32 LE и payload</ns0:text><ns0:text x="310" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">q = ceil((S + 4) / 10)</ns0:text><ns0:text x="310" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Дополнить нулями до 10q байт</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n3">
      <ns0:desc>Разделить на D0 ... D9
10 равных фрагментов по q байт
Операции в GF(256)</ns0:desc>
      <ns0:rect x="80" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="310" y="369.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Разделить на D0 ... D9</ns0:text><ns0:text x="310" y="397.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">10 равных фрагментов по q байт</ns0:text><ns0:text x="310" y="425.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Операции в GF(256)</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n4">
      <ns0:desc>Вычислить P0 и P1
Два проверочных фрагмента
P[j] = Gp × D[j] в GF(256)</ns0:desc>
      <ns0:rect x="80" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="310" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вычислить P0 и P1</ns0:text><ns0:text x="310" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Два проверочных фрагмента</ns0:text><ns0:text x="310" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">P[j] = Gp × D[j] в GF(256)</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n5">
      <ns0:desc>Вычислить CRC32 фрагментов
12 контрольных сумм u32 LE
CRC находится вне RS</ns0:desc>
      <ns0:rect x="80" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="310" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вычислить CRC32 фрагментов</ns0:text><ns0:text x="310" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">12 контрольных сумм u32 LE</ns0:text><ns0:text x="310" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">CRC находится вне RS</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n6">
      <ns0:desc>Записать защищённые данные
CRC32[12] | D0 ... D9 | P0 | P1
Заголовок блока — три копии</ns0:desc>
      <ns0:rect x="80" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="310" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать защищённые данные</ns0:text><ns0:text x="310" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">CRC32[12] | D0 ... D9 | P0 | P1</ns0:text><ns0:text x="310" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Заголовок блока — три копии</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n7">
      <ns0:desc>Декодирование</ns0:desc>
      <ns0:text x="965" y="54.84" text-anchor="middle" font-family="Arial" font-size="26px" fill="#ececef" font-weight="bold">Декодирование</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n8">
      <ns0:desc>Прочитать CRC и 12 фрагментов
q задаётся размером блока
Несовпадение CRC — стирание</ns0:desc>
      <ns0:rect x="740" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="970" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать CRC и 12 фрагментов</ns0:text><ns0:text x="970" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">q задаётся размером блока</ns0:text><ns0:text x="970" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Несовпадение CRC — стирание</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n9">
      <ns0:desc>Проверить число стираний e
e &gt; 2: ошибка; e = 0: без ремонта
e = 1 или 2: reconstruct</ns0:desc>
      <ns0:rect x="740" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="970" y="369.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить число стираний e</ns0:text><ns0:text x="970" y="397.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">e &gt; 2: ошибка; e = 0: без ремонта</ns0:text><ns0:text x="970" y="425.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">e = 1 или 2: reconstruct</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n10">
      <ns0:desc>Собрать D0 ... D9
Прочитать внутренний размер S
Проверить S ≤ 10q − 4; взять Y</ns0:desc>
      <ns0:rect x="740" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="970" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Собрать D0 ... D9</ns0:text><ns0:text x="970" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать внутренний размер S</ns0:text><ns0:text x="970" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить S ≤ 10q − 4; взять Y</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n11">
      <ns0:desc>Восстановить исходный блок
Только при S &lt; N: rANS → LZ77
При S = N сжатие пропускается</ns0:desc>
      <ns0:rect x="740" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="970" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Восстановить исходный блок</ns0:text><ns0:text x="970" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Только при S &lt; N: rANS → LZ77</ns0:text><ns0:text x="970" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">При S = N сжатие пропускается</ns0:text></ns0:g>
    <ns0:g data-vertex-id="n12">
      <ns0:desc>Проверить длину результата N
Вернуть данные и число e
Счётчик — фрагменты, не байты</ns0:desc>
      <ns0:rect x="740" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
      <ns0:text x="970" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить длину результата N</ns0:text><ns0:text x="970" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вернуть данные и число e</ns0:text><ns0:text x="970" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Счётчик — фрагменты, не байты</ns0:text></ns0:g>
