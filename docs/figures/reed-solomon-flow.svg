<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1158" viewBox="0 0 1202 1158"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="265.75" y="74.75">Кодирование</text></g><rect x="40.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="182.75">Разделить вход на слова</text><text x="270.75" y="204.75">До 223 байт данных в каждом слове.</text><text x="270.75" y="226.75">Последнее слово может быть короче.</text></g><rect x="40.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="392.75">Вычислить проверочную часть</text><text x="270.75" y="414.75">Операции в GF(256).</text><text x="270.75" y="436.75">32 байта чётности для каждого слова.</text></g><rect x="40.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="591.75">Записать кодовое слово</text><text x="270.75" y="613.75">Сначала данные, затем проверочные</text><text x="270.75" y="635.75">байты.</text><text x="270.75" y="657.75">Длина полного слова: 223 + 32 = 255.</text></g><rect x="40.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="812.75">Записать остальные слова</text><text x="270.75" y="834.75">Последнее слово: k + 32 байта.</text><text x="270.75" y="856.75">Заполнение до 223 байт не добавляется.</text></g><rect x="40.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="1022.75">Разместить защиту в блоке</text><text x="270.75" y="1044.75">Заголовок: отдельное слово 12 + 32.</text><text x="270.75" y="1066.75">Сохранённые данные: отдельные слова.</text></g><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="925.75" y="74.75">Декодирование</text></g><rect x="700.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="171.75">Прочитать кодовые слова</text><text x="930.75" y="193.75">Исходная длина задаёт ожидаемый</text><text x="930.75" y="215.75">размер.</text><text x="930.75" y="237.75">Полные слова по 255 байт; хвост короче.</text></g><rect x="700.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="381.75">Проверить и исправить слово</text><text x="930.75" y="403.75">Декодер reed-solomon восстанавливает</text><text x="930.75" y="425.75">до 16 неизвестных замен байтов.</text><text x="930.75" y="447.75">Замены могут затронуть и чётность.</text></g><rect x="700.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="602.75">Получить данные слова</text><text x="930.75" y="624.75">Отбросить 32 проверочных байта.</text><text x="930.75" y="646.75">Собрать данные восстановленных слов.</text></g><rect x="700.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="812.75">Восстановить исходный блок</text><text x="930.75" y="834.75">Для сжатого блока: rANS, затем LZ77.</text><text x="930.75" y="856.75">Декодировать включённые этапы.</text></g><rect x="700.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="1011.75">Проверить результат</text><text x="930.75" y="1033.75">Длина и CRC32 исходного блока.</text><text x="930.75" y="1055.75">Для заголовка блока - собственная</text><text x="930.75" y="1077.75">CRC32.</text></g><path d="M 270.75 276.75 L 270.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 325.07 L 266 315.57 L 275.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 486.75 L 270.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 535.07 L 266 525.57 L 275.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 696.75 L 270.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 745.07 L 266 735.57 L 275.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 906.75 L 270.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 955.07 L 266 945.57 L 275.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 276.75 L 930.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 325.07 L 926 315.57 L 935.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 486.75 L 930.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 535.07 L 926 525.57 L 935.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 696.75 L 930.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 745.07 L 926 735.57 L 935.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 906.75 L 930.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 955.07 L 926 945.57 L 935.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/></svg>