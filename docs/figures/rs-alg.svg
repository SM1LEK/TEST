<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1184" viewBox="0 0 1120 1184" role="img"><title>RS • восстановление двух информационных фрагментов</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 240 L560 305" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 405 L560 470" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 618 L560 700" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 845 L560 925" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">RS • восстановление двух информационных фрагментов</text>
<path d="M 154 110 H 990 L 966 240 H 130 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="148.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">S = 6, Y = ASCII ABCDEF; q = 1</text>
<text x="560" y="175" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">D = [6, 0, 0, 0, 65, 66, 67, 68, 69, 70]</text>
<text x="560" y="201.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">P₀ = 189; P₁ = 148</text>
<rect x="180" y="305" width="760" height="100" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="341.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">CRC обнаружила повреждение D₀ и D₁</text>
<text x="560" y="368.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Остальные 10 фрагментов исправны</text>
<rect x="180" y="470" width="760" height="148" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="503.74" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Убрать известные слагаемые из P₀ и P₁</text>
<text x="560" y="530.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">y₀ = 33; y₁ = 83</text>
<text x="560" y="557.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">129D₀ ⊕ 150D₁ = 33</text>
<text x="560" y="584.26" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">150D₀ ⊕ 129D₁ = 83</text>
<rect x="180" y="700" width="760" height="145" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="745.66" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A = [129 150; 150 129]</text>
<text x="560" y="772.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A⁻¹ = [189 219; 219 189]</text>
<text x="560" y="799.34" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[D₀; D₁] = A⁻¹ × [33; 83] = [6; 0]</text>
<path d="M 204 925 H 940 L 916 1025 H 180 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="961.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Восстановить S = 6</text>
<text x="560" y="988.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вернуть ровно ABCDEF, без префикса и заполнения</text>
<text x="560" y="1112" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">⊕ — XOR; матричное умножение и обращение выполняются в GF(256).</text>
</svg>