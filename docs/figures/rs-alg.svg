<svg xmlns="http://www.w3.org/2000/svg" width="1542" height="1948" viewBox="0 0 1542 1948"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="361" y="74.75">Кодирование</text></g><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="1021" y="74.75">Декодирование</text></g><rect x="251" y="116.75" width="240" height="50" rx="25" ry="25" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="149.75">Начало</text></g><path d="M 165 216.75 L 601 216.75 L 577 291.75 L 141 291.75 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="262.25">Вход: S байт; 0 &lt;= S &lt;= 65536</text></g><rect x="141" y="351.75" width="460" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="391.25">Создать Encoder(32)</text><text x="371" y="413.25">p = 0; R = пусто</text></g><rect x="141" y="496.75" width="460" height="65" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="537.25">E(S) = S + 32 × ceil(S / 223)</text></g><path d="M 371 631.75 L 601 684.25 L 371 736.75 L 141 684.25 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="681.25">Остались данные?</text><text x="371" y="703.25">p &lt; S</text></g><rect x="141" y="806.75" width="460" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="846.25">k = min(223, S − p)</text><text x="371" y="868.25">m = данные[p..=p + k - 1]</text></g><rect x="141" y="961.75" width="460" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1002.75">Вычислить 32 проверочных байта</text><text x="371" y="1024.75">r(z) = (m(z) * z^32) mod g(z)</text><text x="371" y="1046.75">Операции в GF(256)</text></g><rect x="141" y="1141.75" width="460" height="115" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1185.25">Собрать кодовое слово:</text><text x="371" y="1207.25">k исходных байтов</text><text x="371" y="1229.25">+ 32 проверочных байта</text></g><rect x="141" y="1326.75" width="460" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1366.25">Добавить слово в R</text><text x="371" y="1388.25">Последнее слово не дополнять нулями</text></g><rect x="141" y="1481.75" width="460" height="55" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1517.25">p = p + k</text></g><path d="M 165 1686.75 L 601 1686.75 L 577 1771.75 L 141 1771.75 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1726.25">Выход: защищённый поток R</text><text x="371" y="1748.25">Длина E(S)</text></g><rect x="251" y="1836.75" width="240" height="50" rx="25" ry="25" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="371" y="1869.75">Конец</text></g><rect x="911" y="116.75" width="240" height="50" rx="25" ry="25" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="149.75">Начало</text></g><path d="M 825 216.75 L 1261 216.75 L 1237 291.75 L 801 291.75 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="262.25">Вход: защищённый поток и размер S</text></g><rect x="801" y="351.75" width="460" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="391.25">Рассчитать E(S)</text><text x="1031" y="413.25">R = пусто; C = 0</text></g><path d="M 1031 506.75 L 1261 561.75 L 1031 616.75 L 801 561.75 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="558.75">Размеры допустимы?</text><text x="1031" y="580.75">S &lt;= 65536; длина = E(S)</text></g><path d="M 1031 681.75 L 1261 734.25 L 1031 786.75 L 801 734.25 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="742.25">Осталось кодовое слово?</text></g><rect x="801" y="856.75" width="460" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="896.25">Взять слово до 255 байт; n = 0</text><text x="1031" y="918.25">Вычислить 32 синдрома</text></g><path d="M 1031 1011.75 L 1261 1064.25 L 1031 1116.75 L 801 1064.25 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="1072.25">Все синдромы нулевые?</text></g><rect x="801" y="1186.75" width="460" height="115" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="1230.25">Найти позиции и величины ошибок</text><text x="1031" y="1252.25">Исправить байты; получить n</text><text x="1031" y="1274.25">Повторно проверить синдромы</text></g><path d="M 1031 1371.75 L 1261 1424.25 L 1031 1476.75 L 801 1424.25 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="1432.25">Восстановление успешно?</text></g><rect x="801" y="1546.75" width="460" height="110" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="1031" y="1587.75">Добавить в R только данные слова</text><text x="1031" y="1609.75">Проверочные байты не выдавать</text><text x="1031" y="1631.75">C = C + n</text></g><path d="M 825 1731.75 L 1261 1731.75 L 1237 1816.75 L 801 1816.75 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" stroke-mite