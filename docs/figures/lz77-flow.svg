<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1241" viewBox="0 0 1200 1241" role="img" aria-labelledby="title desc"><title id="title">LZ77: кодирование</title><desc id="desc">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">LZ77: кодирование</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Прямоугольник — процесс; ромб — условие; параллелограмм — данные.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало</text>
<polygon points="265,250 900,250 875,322 240,322" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="294.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вход X; N ≤ 65536; записать N как LEB128</text>
<rect x="240" y="375" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="419.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">p = 0; создать Matcher</text>
<polygon points="570.0,500 900,558.0 570.0,616 240,558.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="566.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">p &lt; N?</text>
<rect x="240" y="669" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="708.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">limit = min(255, N−p−1)</text>
<text x="570.0" y="737.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Найти (l,d) среди ≤512 кандидатов</text>
<polygon points="265,814 900,814 875,906 240,906" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="853.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Записать l; при l&gt;0 записать d</text>
<text x="570.0" y="882.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Записать c = X[p+l]</text>
<rect x="240" y="959" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="998.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вставить все позиции p…p+l</text>
<text x="570.0" y="1027.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">p ← p+l+1</text>
<rect x="240" y="1104" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1148.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть поток</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 322 V 375" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 447 V 500" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 616 V 669" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="648" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 761 V 814" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 906 V 959" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 240 1005.0 H 134 V 558.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="122" y="993.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Повтор</text>
<path d="M 900 558.0 H 1077 V 1140.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1087" y="546.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text></svg>