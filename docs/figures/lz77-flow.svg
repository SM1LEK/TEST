<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1534" viewBox="0 0 1120 1534" role="img"><title>LZ77 • декодирование и перекрывающаяся ссылка</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 160 L560 208" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 283 L560 331" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 416 L560 464" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 564 L560 612" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 702 L560 750" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 900 L560 948" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 1038 L560 1070 L1100 1070 L1100 514 L780 514" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780 825 L925 825" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 514 L130 514 L130 1126 L560 1126 L560 1176" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 1266 L560 1316" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 1396 L560 1444" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">LZ77 • декодирование и перекрывающаяся ссылка</text>
<rect x="340" y="110" width="440" height="50" rx="25.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="135" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Начало</text>
<path d="M 364 208 H 780 L 756 283 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="245.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход: LZ77-поток</text>
<rect x="340" y="331" width="440" height="85" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="360.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать N ≤ 65536</text>
<text x="560" y="386.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">R = пустой буфер</text>
<path d="M 560.0 464 L 780 514.0 L 560.0 564 L 340 514.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="514" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Остались байты входа?</text>
<path d="M 364 612 H 780 L 756 702 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="643.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать l; при l &gt; 0 прочитать d</text>
<text x="560" y="670.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Прочитать явный байт c</text>
<path d="M 560.0 750 L 780 825.0 L 560.0 900 L 340 825.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="798.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Ссылка допустима?</text>
<text x="560" y="825" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">При l &gt; 0: 1 ≤ d ≤ min(4096, |R|)</text>
<text x="560" y="851.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">l + 1 ≤ N − |R|</text>
<rect x="340" y="948" width="440" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="979.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">l раз: добавить R[|R| − d]</text>
<text x="560" y="1006.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Затем добавить c</text>
<rect x="925" y="795.0" width="160" height="60" rx="30.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="1005" y="825" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Ошибка</text>
<text x="858" y="807" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<rect x="340" y="1176" width="440" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1207.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Проверить |R| = N</text>
<text x="560" y="1234.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Иначе ошибка</text>
<text x="165" y="1011" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<path d="M 364 1316 H 780 L 756 1396 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1356" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выход: исходные N байт</text>
<rect x="430" y="1444" width="260" height="50" rx="25.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1469" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Конец</text>
<text x="595" y="584" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
<text x="595" y="920" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
</svg>