    </ns0:g>
    <ns0:g data-vertex-id="n2">
      <ns0:desc>Начало блока
Записать длину N как varint.
position = 0; новый словарь.</ns0:desc>
      <ns0:rect x="80" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="159.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Начало блока</ns0:text>
      <ns0:text x="310" y="187.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать длину N как varint.</ns0:text>
      <ns0:text x="310" y="215.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">position = 0; новый словарь.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n3">
      <ns0:desc>Найти лучшую ссылку
Окно 4096; длина до 255.
Оставить один байт для литерала.
При равной длине - ближайшая ссылка.</ns0:desc>
      <ns0:rect x="80" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="355.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Найти лучшую ссылку</ns0:text>
      <ns0:text x="310" y="383.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Окно 4096; длина до 255.</ns0:text>
      <ns0:text x="310" y="411.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Оставить один байт для литерала.</ns0:text>
      <ns0:text x="310" y="439.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">При равной длине - ближайшая ссылка.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n4">
      <ns0:desc>Записать тройку
Длина, расстояние, следующий байт.
При длине 0 расстояние не пишется.</ns0:desc>
      <ns0:rect x="80" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="579.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать тройку</ns0:text>
      <ns0:text x="310" y="607.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Длина, расстояние, следующий байт.</ns0:text>
      <ns0:text x="310" y="635.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">При длине 0 расстояние не пишется.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n5">
      <ns0:desc>Обновить словарь
Добавить все пройденные позиции.
position += длина + 1.</ns0:desc>
      <ns0:rect x="80" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Обновить словарь</ns0:text>
      <ns0:text x="310" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Добавить все пройденные позиции.</ns0:text>
      <ns0:text x="310" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">position += длина + 1.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n6">
      <ns0:desc>Перейти к следующей тройке
Пока position &lt; N: повторить шаги 2–4.
Иначе вернуть поток LZ77.</ns0:desc>
      <ns0:rect x="80" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="310" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Перейти к следующей тройке</ns0:text>
      <ns0:text x="310" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Пока position &lt; N: повторить шаги 2–4.</ns0:text>
      <ns0:text x="310" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Иначе вернуть поток LZ77.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n7">
      <ns0:desc>Декодирование</ns0:desc>
      <ns0:text x="965" y="54.84" text-anchor="middle" font-family="Arial" font-size="26px" fill="#ececef" font-weight="bold">Декодирование</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n8">
      <ns0:desc>Прочитать поток
Прочитать N один раз; затем тройку.
При ненулевой длине - расстояние.
Прочитать следующий явный байт.</ns0:desc>
      <ns0:rect x="740" y="100" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="145.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать поток</ns0:text>
      <ns0:text x="970" y="173.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать N один раз; затем тройку.</ns0:text>
      <ns0:text x="970" y="201.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">При ненулевой длине - расстояние.</ns0:text>
      <ns0:text x="970" y="229.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Прочитать следующий явный байт.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n9">
      <ns0:desc>Проверить ссылку
Расстояние не больше окна и выхода.
Ненулевая ссылка: расстояние &gt; 0.
Длина + литерал не выходят за N.</ns0:desc>
      <ns0:rect x="740" y="310" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="355.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить ссылку</ns0:text>
      <ns0:text x="970" y="383.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Расстояние не больше окна и выхода.</ns0:text>
      <ns0:text x="970" y="411.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Ненулевая ссылка: расстояние &gt; 0.</ns0:text>
      <ns0:text x="970" y="439.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Длина + литерал не выходят за N.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n10">
