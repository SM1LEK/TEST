Копировать по одному байту назад
на заданное расстояние.
Перекрытие ссылки допустимо.</ns0:desc>
      <ns0:rect x="740" y="520" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="565.24" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Восстановить совпадение</ns0:text>
      <ns0:text x="970" y="593.4" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Копировать по одному байту назад</ns0:text>
      <ns0:text x="970" y="621.56" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">на заданное расстояние.</ns0:text>
      <ns0:text x="970" y="649.72" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Перекрытие ссылки допустимо.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n11">
      <ns0:desc>Добавить литерал
Записать следующий явный байт.
До конца потока повторять шаги 1–4.</ns0:desc>
      <ns0:rect x="740" y="730" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="789.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Добавить литерал</ns0:text>
      <ns0:text x="970" y="817.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Записать следующий явный байт.</ns0:text>
      <ns0:text x="970" y="845.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">До конца потока повторять шаги 1–4.</ns0:text>
    </ns0:g>
    <ns0:g data-vertex-id="n12">
      <ns0:desc>Завершить блок
Проверить: восстановлено ровно N байт.
Вернуть исходный блок.</ns0:desc>
      <ns0:rect x="740" y="940" width="460" height="160" rx="0" ry="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
      <ns0:text x="970" y="999.32" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Завершить блок</ns0:text>
      <ns0:text x="970" y="1027.48" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Проверить: восстановлено ровно N байт.</ns0:text>
      <ns0:text x="970" y="1055.64" text-anchor="middle" font-family="Arial" font-size="22px" fill="#ececef">Вернуть исходный блок.</ns0:text>
    </ns0:g>
