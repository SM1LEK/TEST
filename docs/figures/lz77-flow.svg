<svg xmlns="http://www.w3.org/2000/svg" width="1202" height="1158" viewBox="0 0 1202 1158"><defs/><rect width="100%" height="100%" fill="#1f1e24"/><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="265.75" y="74.75">Кодирование</text></g><rect x="40.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="182.75">Начало блока</text><text x="270.75" y="204.75">Записать длину N как varint.</text><text x="270.75" y="226.75">position = 0; новый словарь.</text></g><rect x="40.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="381.75">Найти лучшую ссылку</text><text x="270.75" y="403.75">Окно 4096; длина до 255.</text><text x="270.75" y="425.75">Оставить один байт для литерала.</text><text x="270.75" y="447.75">При равной длине - ближайшая ссылка.</text></g><rect x="40.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="602.75">Записать тройку</text><text x="270.75" y="624.75">Длина, расстояние, следующий байт.</text><text x="270.75" y="646.75">При длине 0 расстояние не пишется.</text></g><rect x="40.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="812.75">Обновить словарь</text><text x="270.75" y="834.75">Добавить все пройденные позиции.</text><text x="270.75" y="856.75">position += длина + 1.</text></g><rect x="40.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="270.75" y="1022.75">Перейти к следующей тройке</text><text x="270.75" y="1044.75">Пока position &lt; N: повторить шаги 2–4.</text><text x="270.75" y="1066.75">Иначе вернуть поток LZ77.</text></g><g fill="#ececef" font-family="Arial" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="26px"><text x="925.75" y="74.75">Декодирование</text></g><rect x="700.75" y="116.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="171.75">Прочитать поток</text><text x="930.75" y="193.75">Прочитать N один раз; затем тройку.</text><text x="930.75" y="215.75">При ненулевой длине - расстояние.</text><text x="930.75" y="237.75">Прочитать следующий явный байт.</text></g><rect x="700.75" y="326.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="381.75">Проверить ссылку</text><text x="930.75" y="403.75">Расстояние не больше окна и выхода.</text><text x="930.75" y="425.75">Ненулевая ссылка: расстояние &gt; 0.</text><text x="930.75" y="447.75">Длина + литерал не выходят за N.</text></g><rect x="700.75" y="536.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="591.75">Восстановить совпадение</text><text x="930.75" y="613.75">Копировать по одному байту назад</text><text x="930.75" y="635.75">на заданное расстояние.</text><text x="930.75" y="657.75">Перекрытие ссылки допустимо.</text></g><rect x="700.75" y="746.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="812.75">Добавить литерал</text><text x="930.75" y="834.75">Записать следующий явный байт.</text><text x="930.75" y="856.75">До конца потока повторять шаги 1–4.</text></g><rect x="700.75" y="956.75" width="460" height="160" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" pointer-events="none"/><g fill="#ececef" font-family="Arial" pointer-events="none" text-anchor="middle" font-size="18px"><text x="930.75" y="1022.75">Завершить блок</text><text x="930.75" y="1044.75">Проверить: восстановлено ровно N байт.</text><text x="930.75" y="1066.75">Вернуть исходный блок.</text></g><path d="M 270.75 276.75 L 270.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 325.07 L 266 315.57 L 275.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 486.75 L 270.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 535.07 L 266 525.57 L 275.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 696.75 L 270.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 745.07 L 266 735.57 L 275.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 906.75 L 270.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 270.75 955.07 L 266 945.57 L 275.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 276.75 L 930.75 315.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 325.07 L 926 315.57 L 935.5 315.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 486.75 L 930.75 525.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 535.07 L 926 525.57 L 935.5 525.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 696.75 L 930.75 735.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 745.07 L 926 735.57 L 935.5 735.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 906.75 L 930.75 945.57" fill="none" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/><path d="M 930.75 955.07 L 926 945.57 L 935.5 945.57 Z" fill="#b3afb9" stroke="#b3afb9" stroke-width="1.5" stroke-miterlimit="10" pointer-events="none"/></svg>