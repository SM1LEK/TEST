<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">rANS: три разных порядка байтов</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">rANS: три разных порядка байтов</text><rect x="30" y="94" width="1140" height="95" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Вход</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">AB×16 — 32 байта: 41 42 41 42 … 41 42. Кодер обходит с конца: B,A,B,A,…</text>
<rect x="30" y="213" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="247" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">Выданные байты</text>
<text x="50" y="284" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">В порядке выдачи кодером: 00 A8 AA AA.</text>
<text x="50" y="315" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">В архив записывается обратный порядок: AA AA A8 00.</text>
<rect x="30" y="363" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="397" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Состояние и полный поток</text>
<text x="50" y="434" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Конечное x = 8389290 = 008002AA hex. Little-endian: AA 02 80 00.</text>
<text x="50" y="465" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Поток: 20 01 41 42 80 10 AA 02 80 00 AA AA A8 00. Всего 14 байт.</text>
<rect x="30" y="513" width="1140" height="126" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="547" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Декодер</text>
<text x="50" y="584" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Читает входной байтовый поток вперёд. При x&lt;L подхватывает байты AA AA A8 00.</text>
<text x="50" y="615" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Получает AB×16; после 32 шагов состояние снова L=8388608.</text></svg>