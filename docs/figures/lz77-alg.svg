<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1359" viewBox="0 0 1120 1359" role="img"><title>LZ77 • кодирование блока</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/>
<path d="M560 160 L560 208" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 283 L560 331" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 419 L560 467" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 567 L560 615" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 710 L560 758" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 853 L560 901" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 996 L560 1024 L900 1024 L900 517 L780 517" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 517 L130 517 L130 1084 L560 1084 L560 1134" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 1214 L560 1269" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" fill="#ececef" font-weight="700">LZ77 • кодирование блока</text>
<rect x="340" y="110" width="440" height="50" rx="25.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="135" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Начало</text>
<path d="M 364 208 H 780 L 756 283 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="245.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вход X; 0 ≤ N ≤ 65536</text>
<rect x="340" y="331" width="440" height="88" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="361.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать N как varint</text>
<text x="560" y="388.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p = 0; создать таблицы поиска</text>
<path d="M 560.0 467 L 780 517.0 L 560.0 567 L 340 517.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="517" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p &lt; N?</text>
<rect x="340" y="615" width="440" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="649.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">limit = min(255, N − p − 1)</text>
<text x="560" y="675.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Найти лучшее совпадение (l, d)</text>
<rect x="340" y="758" width="440" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="792.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать l; при l &gt; 0 записать d</text>
<text x="560" y="818.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать c = X[p + l]</text>
<rect x="340" y="901" width="440" height="95" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="935.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Внести позиции p … p + l в словарь</text>
<text x="560" y="961.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">p = p + l + 1</text>
<path d="M 364 1134 H 780 L 756 1214 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1160.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Выход: N и</text>
<text x="560" y="1187.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">последовательность троек</text>
<text x="170" y="954" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
<rect x="430" y="1269" width="260" height="50" rx="25.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/>
<text x="560" y="1294" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Конец</text>
<text x="595" y="588" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
</svg>