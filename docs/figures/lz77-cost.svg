<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="649" viewBox="0 0 1200 649" role="img" aria-labelledby="title desc"><title id="title">Стоимость команды и ограничение поиска</title><desc id="desc"></desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">Стоимость команды и ограничение поиска</text><rect x="30" y="94" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="50" y="128" font-family="Arial, sans-serif" font-size="24" fill="#84baff" text-anchor="start">Стоимость в байтах</text>
<text x="50" y="165" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Пусть v(d) — длина LEB128 расстояния. Команда без ссылки стоит 2 байта.</text>
<text x="50" y="196" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Команда со ссылкой стоит 2+v(d) байта и описывает l+1 исходных байтов.</text>
<text x="50" y="227" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">При d ≤ 127: выигрыш только если l ≥ 3. При 128 ≤ d ≤ 4096: только если l ≥ 4.</text>
<rect x="30" y="275" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="50" y="309" font-family="Arial, sans-serif" font-size="24" fill="#f1c779" text-anchor="start">Что выбирает код</text>
<text x="50" y="346" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Выбирается наибольшее l среди просмотренных кандидатов; стоимость команды не оптимизируется.</text>
<text x="50" y="377" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">При отсутствии l ≥ 2 проверяется последнее вхождение одного байта (возможна l=1).</text>
<text x="50" y="408" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">После команды в таблицы вставляются все позиции p…p+l.</text>
<rect x="30" y="456" width="1140" height="157" rx="0" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="50" y="490" font-family="Arial, sans-serif" font-size="24" fill="#8bd6b0" text-anchor="start">Пределы</text>
<text x="50" y="527" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">За один поиск: не более 512·255 = 130560 сравнений байтов в хеш-цепочке.</text>
<text x="50" y="558" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">Суммарная грубая оценка O(N·512·255), память O(N+4096+256).</text>
<text x="50" y="589" font-family="Arial, sans-serif" font-size="22" fill="#ececef" text-anchor="start">512 — предел времени поиска; 4096 — окно формата. Они решают разные задачи.</text></svg>