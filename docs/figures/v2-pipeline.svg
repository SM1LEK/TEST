<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="938" viewBox="0 80 1120 938" role="img">
  <title>Блок • выбор между сжатым и исходным представлением</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="938.0" fill="#1f1e24" y="80" />
  <path d="M560 190 L560 238" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 328 L560 382" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M340 432 L270 432 L270 520 L270 560" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M780 432 L850 432 L850 520 L850 560" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M270 640 L270 690 L560 690 L560 740" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M850 640 L850 690 L560 690 L560 740" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560 860 L560 918" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 364 110 H 780 L 756 190 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="150" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Исходный блок X; N байт</text>
  <rect x="340" y="238" width="440" height="90" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="269.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Включённые этапы: LZ77 → rANS</text>
  <text x="560" y="296.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Кандидат C; K = |C|</text>
  <path d="M 560.0 382 L 780 432.0 L 560.0 482 L 340 432.0 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="432" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">K &lt; N?</text>
  <rect x="70" y="560" width="400" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="270" y="600" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Y = C; S = K</text>
  <rect x="650" y="560" width="400" height="80" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="850" y="600" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Y = X; S = N</text>
  <rect x="300" y="740" width="520" height="120" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="773.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Формировать N − 1 и S − 1</text>
  <text x="560" y="800" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">При RS: три копии заголовка</text>
  <text x="560" y="826.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">и защита Y независимо от сжатия</text>
  <path d="M 364 918 H 780 L 756 998 H 340 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="958" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Записать заголовок и payload</text>
  <text x="300" y="420" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Да</text>
  <text x="818" y="420" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" fill="#ececef">Нет</text>
</svg>