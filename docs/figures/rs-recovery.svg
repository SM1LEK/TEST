<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1940.0" viewBox="0 160 1120 1940" role="img">
  <title>RS • восстановление двух информационных фрагментов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3afb9" />
    </marker>
  </defs>
  <rect width="100%" height="1940.0" fill="#1f1e24" y="160.0" />
  <path d="M560 240 L560 305" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 405 L560 470" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 618 L560 700" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M560 845 L560 925" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)" transform="scale(1,2)" />
  <path d="M 154 110 H 990 L 966 240 H 130 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="284.21999999999997" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">S=06₁₆; Y=ABCDEF; q=01₁₆</text>
  <text x="560" y="311.71999999999997" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: S=6; Y=ABCDEF; q=1</text>
  <text x="560" y="337.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">D: 06 00 00 00 41 42 43 44 45 46 (hex)</text>
  <text x="560" y="365.4" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: D: 6 0 0 0 65 66 67 68 69 70 (десятичные значения)</text>
  <text x="560" y="391.58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">P₀=BD₁₆; P₁=94₁₆</text>
  <text x="560" y="419.08" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: P₀=189; P₁=148</text>
  <rect x="180" y="610.0" width="760" height="200.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="683.16" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">CRC обнаружила повреждение D₀ и D₁</text>
  <text x="560" y="724.74" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Остальные 0A₁₆ фрагментов исправны</text>
  <text x="560" y="752.24" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Остальные 10 фрагментов исправны</text>
  <rect x="180" y="940.0" width="760" height="296.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1007.48" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Убрать известные слагаемые из P₀ и P₁</text>
  <text x="560" y="1049.0600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">y₀=21₁₆; y₁=53₁₆</text>
  <text x="560" y="1076.5600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: y₀=33; y₁=83</text>
  <text x="560" y="1102.74" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">81₁₆·D₀ ⊕ 96₁₆·D₁ = 21₁₆</text>
  <text x="560" y="1130.24" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: 129·D₀ ⊕ 150·D₁ = 33</text>
  <text x="560" y="1156.42" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">96₁₆·D₀ ⊕ 81₁₆·D₁ = 53₁₆</text>
  <text x="560" y="1183.92" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: 150·D₀ ⊕ 129·D₁ = 83</text>
  <rect x="180" y="1400.0" width="760" height="290.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" />
  <text x="560" y="1479.22" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A = [81 96; 96 81] (hex)</text>
  <text x="560" y="1506.72" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: A = [129 150; 150 129] (десятичные значения)</text>
  <text x="560" y="1532.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">A⁻¹ = [BD DB; DB BD] (hex)</text>
  <text x="560" y="1560.4" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: A⁻¹ = [189 219; 219 189] (десятичные значения)</text>
  <text x="560" y="1586.5800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">[D₀; D₁] = A⁻¹ × [21₁₆; 53₁₆] = [06₁₆; 00₁₆] (hex)</text>
  <text x="560" y="1614.0800000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: [D₀; D₁] = A⁻¹ × [33; 83] = [6; 0] (десятичные значения)</text>
  <path d="M 204 925 H 940 L 916 1025 H 180 Z" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5" transform="scale(1,2)" />
  <text x="560" y="1911.0600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Восстановить S=06₁₆</text>
  <text x="560" y="1938.5600000000002" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20.0" fill="#bbb6c3">₁₀: Восстановить S=6</text>
  <text x="560" y="1976.84" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" fill="#ececef">Вернуть ровно ABCDEF, без префикса и заполнения</text>
</svg>