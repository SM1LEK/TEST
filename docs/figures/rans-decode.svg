<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1265" viewBox="0 0 1200 1265" role="img" aria-labelledby="title desc"><title id="title">rANS: декодирование</title><desc id="desc">Для n&gt;0. Поток 00 декодируется в пустой вход без чтения модели и состояния.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="30" y="43" font-family="Arial" font-size="29" fill="#8bd6b0">rANS: декодирование</text><text x="30" y="82" font-family="Arial" font-size="20" fill="#bbb6c3">Для n&gt;0. Поток 00 декодируется в пустой вход без чтения модели и состояния.</text><rect x="240" y="125" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="169.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Начало</text>
<polygon points="265,250 900,250 875,342 240,342" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="289.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Прочитать n, модель, x</text>
<text x="570.0" y="318.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Проверить L≤x&lt;256L; построить symbols[4096]</text>
<polygon points="570.0,395 900,453.0 570.0,511 240,453.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="461.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Выдано меньше n байтов?</text>
<rect x="240" y="564" width="660" height="92" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="603.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">q=x&amp;4095; s=symbols[q]; выдать s</text>
<text x="570.0" y="632.5" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">x ← f(s)·(x&gt;&gt;12)+q−c(s)</text>
<polygon points="570.0,709 900,767.0 570.0,825 240,767.0" fill="#1f1e24" stroke="#f1c779" stroke-width="1.4"/>
<text x="570.0" y="775.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">x &lt; L?</text>
<polygon points="265,878 900,878 875,950 240,950" fill="#1f1e24" stroke="#84baff" stroke-width="1.4"/>
<text x="570.0" y="922.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Прочитать b; x ← (x&lt;&lt;8) | b</text>
<rect x="240" y="1003" width="660" height="72" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.4"/>
<text x="570.0" y="1047.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Проверить x=L и отсутствие лишних байтов</text>
<rect x="240" y="1128" width="660" height="72" rx="34" fill="#1f1e24" stroke="#8bd6b0" stroke-width="1.4"/>
<text x="570.0" y="1172.0" font-family="Arial, sans-serif" font-size="21" fill="#ececef" text-anchor="middle">Вернуть исходные n байтов</text>
<path d="M 570.0 197 V 250" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 342 V 395" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 511 V 564" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="543" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 570.0 656 V 709" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 570.0 825 V 878" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="857" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Да</text>
<path d="M 240 914.0 H 145 V 767.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="133" y="902.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Повтор</text>
<path d="M 240 767.0 H 134 V 453.0 H 240" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="122" y="755.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="end">Нет</text>
<path d="M 900 453.0 H 1077 V 1039.0 H 900" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1087" y="441.0" font-family="Arial, sans-serif" font-size="19" fill="#f1c779" text-anchor="start">Нет</text>
<path d="M 570.0 1075 V 1128" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>