[package]
name = 'archiver'
publish = false
autotests = false
edition = '2024'
rust-version = '1.88'
description = 'Блочный архиватор LZ77&rANS&RS'

[lib]
test = false
doctest = false

[[bin]]
name = 'arch'
path = 'src/main.rs'
test = false

[[test]]
name = 'all'
path = 'tests/all.rs'
harness = false

[dependencies]
reed-solomon-erasure = '=6.0.0'
crc32fast = '=1.4.2'
rayon = '=1.12.0'

[[test]]
name = 'bench'
path = 'tests/bench.rs'
harness = false
